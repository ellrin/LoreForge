# L-Echo's LLM tasks, layered over lore-llm's shared tasks.toml. A user file
# `private/LoreEcho/tasks.toml` in the same format can add an `[override]`.
#
#   local:current     the local engine that is connected: LOREECHO_LLM_URL, else the
#                     shared `private/shared/engine.toml` [engine] url
#   claude:selected   the Claude model chosen in the shared 模型 tab (else the catalog
#                     default); the subscription (Claude Code) first, then the API key
#
# 問答 (class ask): the local model when it is there, else Claude. The reply is streamed
# to the page; Claude through the subscription cannot stream and answers in one piece
# (design §2), so `needs.streaming` stays off: it would rule the subscription out.

[task.le-chat]
label = "L-Echo 對話"
# the author picks the model in the header, Google (agy:<model>) like any other (2026-11-24)
agy = true
class = "ask"
needs = { context = 8000 }
default = "local:current"
fallback = "claude:selected"
offline = true
max_tokens = 1200

# 功能列表 (design §4): 整理與格式 (class tidy: the local model when it is there, else Claude).
# One JSON reply each, shown to the author as a preview; nothing is saved until he confirms.
# 記下靈感 uses no model.

[task.le-note]
label = "L-Echo 整理成筆記"
class = "tidy"
needs = { json = true, context = 16000 }
default = "local:current"
fallback = "claude:selected"
offline = true
max_tokens = 3000

# 知識建立一定要上網查 (author, 2026-11-17): every card is written from a web search, so Claude
# only (the local model cannot search); an answer from a call that did not search is refused.
[task.le-cards]
label = "L-Echo 做成知識卡（上網查）"
needs = { json = true, web = true, context = 16000 }
default = "claude:selected"
fallback = "claude:haiku"
offline = false
max_tokens = 4000

# 修正知識卡 (author, 2026-11-14): one card he says is wrong is checked on the web by Claude Haiku
# and a corrected version proposed; he sees old and new and applies it himself. Only this card and
# his words about it go to Claude. No local model: it cannot search.
[task.le-fix]
label = "L-Echo 修正知識卡"
class = "tidy"
needs = { json = true, web = true, context = 16000 }
default = "claude:haiku"
offline = false
max_tokens = 4000

# 知識中樞 (docs/brain-hub.md §4.2): a picture of a flow figure split into figure / modules / components
# and proposed to L-Brain's hub (the author approves each proposal there; nothing is written here).
# The picture goes to the cloud (Claude); the author accepts that only for figures from papers and his
# own slides. Claude only: the local model is too small to read a diagram and miss the parts (no class,
# so the shared routing cannot put it in), and never offline.
[task.le-know-figure]
label = "L-Echo 把圖拆成大中小（看圖）"
needs = { vision = true, json = true }
default = "claude:selected"
fallback = "claude:sonnet"
offline = false
max_tokens = 6000

# 知識中樞: one hub item changed on the author's instruction; the model returns only the fields that
# change, and the result is proposed to L-Brain, never written. Text only, no web search.
[task.le-know-edit]
label = "L-Echo 照指示改一條知識"
class = "tidy"
needs = { json = true, context = 16000 }
default = "local:current"
fallback = "claude:selected"
offline = true
max_tokens = 3000
