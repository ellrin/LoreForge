[package]
name = "loreshelf"
version.workspace = true
edition.workspace = true
description = "LoreShelf desktop app"

# Desktop shell: starts shelf-server in-process (or reuses one already answering on the
# configured port) and opens a screen-sized, frameless, transparent window with macOS
# vibrancy behind the page. Dock click shows / hides it; the page hides it on Esc.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shelf-server.workspace = true
lore-catalog.workspace = true
lore-home.workspace = true
# macos-private-api: a transparent window on macOS.
tauri = { version = "2", features = ["macos-private-api"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
