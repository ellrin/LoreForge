# LoreShelf's LLM tasks, layered over lore-llm's shared tasks.toml.
#
#   local:current   the model all LoreForge apps share (private/shared/engine.toml) on the machine's
#                   one llama-server (lore-llm shared_runtime)
#
# Sorting the term pool reads sentences from all the author's files, papers or not: local only,
# no fallback (author, 2026-11-13: files other than papers and slide decks never go to a cloud
# model). It runs in the background and gives way to any app the author is using.

[task.shelf-classify-terms]
label = "候選詞分類"
class = "tidy"
needs = { json = true, context = 16000 }
default = "local:current"
offline = true
max_tokens = 6000

# The known cards' titles (the author, 2026-11-13: run on Claude Haiku). Only terms found in a paper
# or a slide deck are sent, with sentences from those files only, never a file name or path.
[task.shelf-card-titles]
label = "卡片標題"
class = "tidy"
needs = { json = true, context = 16000 }
default = "claude:haiku"
max_tokens = 8000

# 歸位 (author, 2026-11-13): a paper or slide deck the rules cannot place goes to Claude Haiku with
# its first text only (no file name, path or folder); every other file stays on the machine.
[task.shelf-filing-papers]
label = "歸位：論文主題"
class = "tidy"
needs = { json = true, context = 16000 }
default = "claude:haiku"
max_tokens = 4000

[task.shelf-filing-files]
label = "歸位：其他檔案"
class = "tidy"
needs = { json = true, context = 16000 }
default = "local:current"
offline = true
max_tokens = 3000

# Cards for terms found only in the author's other files (notes, homework): written on the machine.
[task.shelf-card-local]
label = "卡片內容（本機）"
class = "tidy"
needs = { json = true, context = 16000 }
default = "local:current"
offline = true
max_tokens = 8000
