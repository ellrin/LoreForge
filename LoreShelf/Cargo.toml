[workspace]
resolver = "3"
members = ["crates/cli", "crates/server", "apps/desktop"]
# `cargo build` / `cargo test` skip the desktop app (no WebView libraries needed);
# build it with `cargo run -p loreshelf` or `../scripts/install-apps.sh LoreShelf`.
default-members = ["crates/cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lore-catalog = { path = "../commons/crates/lore-catalog" }
shelf-server = { path = "crates/server" }
lore-home = { path = "../commons/crates/lore-home" }
lore-shell = { path = "../commons/crates/lore-shell" }
lore-words = { path = "../commons/crates/lore-words" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
