<!doctype html>
<html lang="zh-Hant" data-theme="giftbox" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoreEcho</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%2312AFC0' stroke-width='2'/%3E%3Ccircle cx='9' cy='11' r='2' fill='none' stroke='%23E0A100' stroke-width='1.5'/%3E%3Ccircle cx='15' cy='11' r='2' fill='none' stroke='%23E0A100' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="prefs.css">
  <script src="theme.js"></script>
</head>
<body>
  <!-- collapsed: the bubble (drag to move, click to open) -->
  <button type="button" class="bubble" id="bubble" aria-label="打開 LoreEcho" title="LoreEcho（拖曳可移動）">
    <img id="bubbleImg" alt="" draggable="false" hidden>
    <span class="fallback" id="bubbleIcon" data-icon="chat"></span>
  </button>

  <!-- expanded, like a visual novel: the character stands large on the left (only the figure
       is drawn, the legs may run off the bottom), the conversation on the right — header and a
       quiet history, the 功能列表 as choice rows (toggled from the header), and the dialogue
       box with the character's name tag, the current line and the input row. -->
  <div class="win" id="win" hidden>
    <div class="col">
      <section class="card" aria-label="LoreEcho">
        <header class="top" data-tauri-drag-region></header>
        <ol class="hist" id="hist" aria-label="這次的對話" data-tauri-drag-region></ol>
      </section>
      <div class="choices" id="choices" role="group" aria-label="功能列表" hidden>
        <button type="button" class="choice" aria-disabled="true" title="下一階段" data-tool="note"><span class="desc">把剛剛的討論整理成一篇筆記</span><span class="label">整理成筆記</span></button>
        <button type="button" class="choice" aria-disabled="true" title="下一階段" data-tool="cards"><span class="desc">挑出值得記住的概念</span><span class="label">做成知識卡</span></button>
        <button type="button" class="choice" aria-disabled="true" title="下一階段" data-tool="idea"><span class="desc">一句話先存起來</span><span class="label">記下靈感</span></button>
      </div>
      <section class="box" id="box" aria-label="對話框">
        <button type="button" class="nametag" id="nametag" aria-haspopup="menu" title="換人物"><img id="whoImg" class="who-img" alt="" draggable="false" hidden><span id="who">LoreEcho</span><span data-icon="chevron"></span></button>
        <div class="line empty" id="line" aria-live="polite">想聊什麼都可以。對話只留在這個視窗裡，按「新對話」或收起就清掉。</div>
        <form class="input" id="form" autocomplete="off">
          <button type="button" class="ico" id="mic" disabled aria-label="語音（之後的階段）" title="語音輸入：之後的階段才會有"><span data-icon="mic"></span></button>
          <textarea id="text" rows="1" placeholder="說點什麼…（Shift+↵ 換行）" aria-label="訊息"></textarea>
          <button type="submit" class="ico" id="send" aria-label="送出 ↵"><span data-icon="send"></span></button>
        </form>
      </section>
    </div>
    <div class="figure" id="figure" data-state="idle" data-tauri-drag-region aria-hidden="true">
      <img id="full" alt="" draggable="false" data-tauri-drag-region hidden>
      <span class="fallback" id="fullIcon" data-icon="chat" data-tauri-drag-region></span>
    </div>
  </div>

  <template id="tplGeneral">
    <div class="set-sec">
      <div class="set-label">叫出／收起</div>
      <div class="set-row"><span class="k">全域快捷鍵</span><input class="set-input" id="setShortcut" placeholder="Alt+Space" aria-label="全域快捷鍵" spellcheck="false"></div>
    </div>
  </template>

  <script src="icons.js"></script>
  <script src="shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
