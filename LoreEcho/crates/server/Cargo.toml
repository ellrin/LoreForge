[package]
name = "le-server"
version.workspace = true
edition.workspace = true

# Local server on 127.0.0.1 (7860 in browser mode, a free port in the desktop app):
# serves web/, the shared theme and shell, the 模型 settings, the window state, the
# characters and the streamed chat (task le-chat). It keeps no conversation.

[dependencies]
lore-home.workspace = true
lore-llm.workspace = true
lore-engines.workspace = true
lore-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
futures-util.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
