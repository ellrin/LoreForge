# L-Slide's own LLM tasks, in lore-llm's tasks.toml format, merged with lore-flow's
# (sc-flow-graph) and lore-llm's shared table (sc-crop-modules) in `engines()` / `llm.rs`.
#
# 論文報告 is made by Opus (the author, 2026-11-19: the deck must be right, tokens are not the
# concern), Sonnet when Opus cannot answer. No class: a class lets the shared routing put the
# local model in (`tidy` = local first, which sent the two vision tasks to the small local
# model: no module boxes, misread equations).

[task.sc-paper-deck]
label = "論文做成簡報"
# text and JSON only: the start panel may name an Antigravity model for it
agy = true
needs = { json = true, context = 32000 }
default = "claude:opus"
fallback = "claude:sonnet"
offline = true
max_tokens = 12000

# A display equation's LaTeX compared with its crop (and its typeset rendering) symbol by
# symbol, corrected when it differs (todeck/extract.rs); no agreement = the crop is shown.
[task.sc-read-equation]
label = "從截圖讀出方程式"
needs = { vision = true, json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 2000

# 微調's 建議: right after the outline, a few concrete edits with a one-line reason each
# (todeck/suggest.rs). Best-effort: the review window simply shows none when this cannot run.
[task.sc-outline-review]
label = "大綱建議"
# text and JSON only: the start panel may name an Antigravity model for it
agy = true
needs = { json = true, context = 16000 }
default = "claude:opus"
fallback = "claude:sonnet"
offline = true
max_tokens = 2000

# 微調's 預想選項: right after the outline (and its 建議), 2–3 alternative points per content
# slide and 2–3 lines only the presenter can add, each tied to records the job sent (the paper,
# the author's own L-Paper papers and decks, matched L-Brain cards); checked in code
# (todeck/interview.rs). Best-effort: without it the window takes free answers.
[task.sc-deck-interview]
label = "大綱預想選項"
# text and JSON only: the start panel may name an Antigravity model for it
agy = true
needs = { json = true, context = 32000 }
default = "claude:opus"
fallback = "claude:sonnet"
offline = true
max_tokens = 16000

# The main figure explained in parts: the model looks at the paper's figures, names the
# method's big picture, says whether to walk through it in parts and where to cut it
# (todeck/figparts.rs). Failing twice = an equal split with a warning.
[task.sc-figure-parts]
label = "看圖決定架構圖怎麼分段"
needs = { vision = true, json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 1500

# An L-Reader PDF, page by page: the model looks at each page and lists its figures and
# tables (boxes, captions), display equations (boxes, LaTeX) and, on the first page, the
# authors (todeck/extract.rs). The rule-based detector's boxes are only proposals.
[task.sc-locate-material]
label = "看論文頁面找圖表與方程式"
needs = { vision = true, json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 6000

# Each figure / table crop shown back: exactly that item, whole, nothing else?
[task.sc-check-crop]
label = "確認截圖的範圍"
needs = { vision = true, json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 800

# 改頁 through L-Echo (pageedit.rs): one or two slides as data and pictures plus the presenter's
# instruction → a constrained plan of edits (set_text, set_notes, split_slide, insert_slide) that
# the program checks and compiles; never ops, sizes or coordinates. A request may name a Claude
# model (`claude:<alias>`); the local and Antigravity models cannot see the page and are refused.
[task.sc-page-edit]
label = "改頁（L-Echo）"
needs = { vision = true, json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 4000

# The edited page, rendered, looked at: wrapped lines, overlaps, cut-off text (findings).
[task.sc-page-check]
label = "看改過的頁面"
needs = { vision = true, json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 1500
