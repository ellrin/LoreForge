# L-Brain's LLM tasks, layered over lore-llm's shared tasks.toml. A user file
# `<settings folder>/KnowledgeBase/tasks.toml` in the same format can add an `[override]`.
#
#   local:current     the local engine that is connected: the OpenAI-compatible server
#                     in config.toml `[engine] url` (or KB_LLM_URL)
#   claude:selected   the Claude model from config.toml `claude_model` (else the catalog
#                     default); the subscription (Claude Code) first, then the API key
#
# Same order as L-Reader's translation: local first, Claude when the local model is not
# connected. The card draft stays a draft: the author edits it before saving.

# 知識建立一定要上網查 (author, 2026-11-17): the draft comes from a web search, so Claude only
# (the local model cannot search); an answer from a call that did not search is refused.
[task.kb-summarize-card]
label = "起草知識卡摘要（上網查）"
needs = { json = true, web = true }
default = "claude:selected"
fallback = "claude:haiku"
offline = false

# 收件 (docs/brain-hub.md §16): a sentence handed over becomes a pattern with its holes cut. The
# worker runs one at a time in the background; sentences read aloud go to the local model first,
# Claude only when the local one is not connected.
[task.kb-inbox-pattern]
label = "收件：句子變句型"
class = "tidy"
needs = { json = true }
default = "local:current"
fallback = "claude:selected"
offline = true
