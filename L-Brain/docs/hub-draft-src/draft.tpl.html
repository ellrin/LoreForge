<!doctype html>
<html lang="zh-Hant" data-theme="synthwave">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L-Brain 知識中樞（畫面草稿）</title>
<!-- Design draft (docs/brain-hub.md §8). The figures are really drawn by the flow tool (lore-know example `thumbs`);
     counts of other families and all text content are synthetic. Views: #dash #dashb #list #wall #cards. Not wired. -->
<link rel="stylesheet" href="../../commons/ui/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Noto Sans TC", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .hub { display: grid; grid-template-columns: 188px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top b { font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  .top input { flex: 0 1 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 7px 10px; font: inherit; }
  .top .sp { flex: 1; }
  .ghostb { border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--muted); background: none; white-space: nowrap; }
  .plus { background: none; color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 12px; font: 600 13px/1 inherit; white-space: nowrap; }

  .nav { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 8px; overflow: auto; }
  .nav a { display: flex; align-items: center; padding: 7px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; }
  .nav a span { margin-left: auto; font: 12px "JetBrains Mono", monospace; color: var(--faint); }
  .nav a[aria-current] { background: var(--accent-soft); color: var(--text); }
  .nav hr { border: 0; border-top: 1px solid var(--line); margin: 10px 6px; }

  main { overflow: auto; }
  .v { display: none; }
  .v.on { display: block; }
  .fake { color: var(--faint); font-size: 11px; padding: 0 28px 24px; }

  /* ── dashboard: the state of the whole database at a glance; every panel opens what it measures ── */
  .dash { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; padding: 20px 26px 12px; }
  .pn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; min-width: 0; display: block; }
  a.pn:hover, .pn a.r:hover { border-color: var(--line-strong); }
  .pn h3 { margin: 0 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; display: flex; }
  .pn h3 span { margin-left: auto; color: var(--faint); font-weight: 400; }
  .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .hero-n { font: 600 52px/1 "Noto Sans TC", system-ui, sans-serif; letter-spacing: -.01em; }
  .hero-s { color: var(--muted); font-size: 13px; margin-left: 10px; }
  .seg { display: flex; gap: 2px; height: 34px; margin: 16px 0 14px; }
  .seg i { display: flex; align-items: center; padding: 0 8px; border-radius: 4px; font: 500 12px "Noto Sans TC", sans-serif; color: #fff; overflow: hidden; white-space: nowrap; min-width: 4px; }
  .seg.thin { height: 10px; margin: 10px 0 10px; }
  .seg.thin i { padding: 0; border-radius: 3px; }
  .fr { display: grid; grid-template-columns: 12px 108px 56px 1fr 60px; gap: 10px; align-items: center; padding: 6px 6px; border-radius: 6px; font-size: 13px; border: 1px solid transparent; }
  .fr:hover { background: var(--surface); }
  .fr .sw { width: 10px; height: 10px; border-radius: 3px; }
  .fr .n { text-align: right; }
  .fr .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fr .d { text-align: right; font-size: 12px; color: var(--muted); }
  .fr .d.z { color: var(--faint); }
  .chart { width: 100%; display: block; overflow: visible; }
  .chart text { fill: var(--faint); font: 10px "JetBrains Mono", monospace; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat b { font: 600 30px/1 "Noto Sans TC", sans-serif; }
  .stat span { color: var(--muted); font-size: 12px; }
  .lg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .mt { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; padding: 7px 6px; border-radius: 6px; font-size: 13px; }
  .mt:hover { background: var(--surface); }
  .mt .v { color: var(--muted); font-size: 12px; }
  .mt .tr { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
  .mt .tr i { display: block; height: 100%; border-radius: 4px; background: var(--muted); }
  .mt .miss { color: var(--accent-text); }
  .todo { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .todo h3 { color: inherit; opacity: .8; }
  .todo .stat span { color: inherit; opacity: .8; }
  .ub { display: grid; grid-template-columns: 150px 1fr 40px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 13px; }
  .ub:hover { background: var(--surface); }
  .ub .bar { height: 12px; display: flex; gap: 2px; }
  .ub .bar i { border-radius: 0 4px 4px 0; height: 100%; }
  .ub .n { text-align: right; font-size: 12px; color: var(--muted); }
  .pick { position: fixed; right: 18px; bottom: 16px; z-index: 8; display: none; gap: 2px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px; font-size: 12px; }
  .pick a { padding: 5px 13px; border-radius: 999px; color: var(--muted); }
  .pick a[aria-current] { background: var(--accent); color: var(--accent-ink); }
  .tip { position: fixed; z-index: 9; pointer-events: none; background: var(--surface-hover); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 9px; font-size: 12px; white-space: nowrap; display: none; }


  /* ── cover style 2: instruments ── */
  .hud { display: grid; grid-template-columns: 360px minmax(0, 1fr) 270px; gap: 18px; padding: 22px 26px 12px; min-height: calc(100vh - 90px);
    background-image: linear-gradient(var(--dot) 1px, transparent 1px), linear-gradient(90deg, var(--dot) 1px, transparent 1px); background-size: 28px 28px; }
  .hud .cap { font: 600 10px/1 "JetBrains Mono", monospace; letter-spacing: .16em; color: var(--faint); text-transform: uppercase; margin-bottom: 10px; display: flex; }
  .hud .cap span { margin-left: auto; }
  .hud .box { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; background: color-mix(in srgb, var(--panel) 82%, transparent); position: relative; display: block; }
  .hud .box::before, .hud .box::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1.5px solid var(--accent-2); }
  .hud .box::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
  .hud .box::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
  .hud .ring { position: relative; }
  .hud .ring .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .hud .ring .mid b { display: block; font: 600 46px/1 "JetBrains Mono", monospace; }
  .hud .ring .mid span { font: 11px "JetBrains Mono", monospace; color: var(--faint); letter-spacing: .14em; }
  .hud .hr { display: grid; grid-template-columns: 10px 96px minmax(0, 1fr) 48px 40px; gap: 10px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line); font-size: 13px; }
  .hud .hr:first-of-type { border-top: 0; }
  .hud .hr:hover { background: var(--surface); }
  .hud .hr .tk { height: 4px; background: var(--surface); }
  .hud .hr .tk i { display: block; height: 100%; }
  .hud .hr .n { text-align: right; font: 13px "JetBrains Mono", monospace; }
  .hud .hr .d { text-align: right; font: 11px "JetBrains Mono", monospace; color: var(--faint); }
  .hud .gs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hud .gg { text-align: center; font-size: 12px; color: var(--muted); display: block; padding: 6px 0; }
  .hud .gg:hover { background: var(--surface); }
  .hud .gg svg { width: 76px; height: 76px; display: block; margin: 0 auto 4px; }
  .hud .gg svg text { fill: var(--text); font: 600 15px "JetBrains Mono", monospace; }
  .hud .alert { border-color: var(--accent); }
  .hud .alert b { font: 600 34px/1 "JetBrains Mono", monospace; color: var(--accent-text); }
  .hud .col { min-width: 0; display: flex; flex-direction: column; gap: 18px; }

  /* ── cover style 3: one sheet ── */
  .sheet { padding: 44px 56px 20px; max-width: 1180px; }
  .sheet .lead { display: flex; align-items: flex-end; gap: 28px; margin-bottom: 34px; }
  .sheet .lead b { font: 300 112px/.85 "Noto Sans TC", system-ui, sans-serif; letter-spacing: -.03em; }
  .sheet .lead p { margin: 0 0 8px; font-size: 15px; line-height: 1.7; color: var(--muted); max-width: 440px; }
  .sheet .lead p em { font-style: normal; color: var(--text); }
  .sheet .lead .acts3 { margin-left: auto; display: flex; gap: 26px; margin-bottom: 8px; }
  .sheet .lead .acts3 a { display: block; text-align: right; }
  .sheet .lead .acts3 a b { font: 500 34px/1 "Noto Sans TC", sans-serif; display: block; letter-spacing: 0; }
  .sheet .lead .acts3 a span { font-size: 12px; color: var(--muted); }
  .sheet .lead .acts3 a.hot b { color: var(--accent-text); }
  .sheet table { width: 100%; border-collapse: collapse; }
  .sheet th { text-align: left; font: 500 11px "JetBrains Mono", monospace; letter-spacing: .1em; color: var(--faint); padding: 0 10px 10px 0; border-bottom: 1px solid var(--line-strong); }
  .sheet td { padding: 15px 10px 15px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
  .sheet tr.r { cursor: pointer; }
  .sheet tr.r:hover td { background: var(--panel); }
  .sheet td.nm { font-size: 17px; font-weight: 500; white-space: nowrap; }
  .sheet td.n { font: 400 22px "Noto Sans TC", sans-serif; text-align: right; padding-right: 22px; }
  .sheet td .sub { color: var(--faint); font-size: 12px; }
  .sheet td .sb { height: 6px; border-radius: 3px; }
  .sheet td.gap { color: var(--accent-text); font-size: 12px; white-space: nowrap; }
  .sheet td.gap.ok { color: var(--faint); }
  .sheet svg.sp { width: 150px; height: 30px; display: block; overflow: visible; }


  /* ── the chosen cover: B's grid and ring, C's table ── */
  .cv { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 20px; padding: 22px 26px 12px; min-height: calc(100vh - 90px); align-items: start;
    background-image: linear-gradient(var(--dot) 1px, transparent 1px), linear-gradient(90deg, var(--dot) 1px, transparent 1px); background-size: 28px 28px; }
  .cv .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .cv .box { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; background: color-mix(in srgb, var(--panel) 86%, transparent); position: relative; display: block; }
  .cv .box::before, .cv .box::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1.5px solid var(--accent-2); }
  .cv .box::before { left: -1px; top: -1px; border-right: 0; border-bottom: 0; }
  .cv .box::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; }
  .cv .cap { font: 600 10px/1 "JetBrains Mono", monospace; letter-spacing: .16em; color: var(--faint); margin-bottom: 10px; display: flex; }
  .cv .cap span { margin-left: auto; }
  .cv .ring { position: relative; }
  .cv .ring .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .cv .ring .mid b { display: block; font: 600 44px/1 "JetBrains Mono", monospace; }
  .cv .ring .mid span { font-size: 12px; color: var(--faint); letter-spacing: .1em; }
  .ym { font: italic 11px "Source Serif 4", Georgia, serif; fill: var(--muted); color: var(--muted); letter-spacing: .02em; }
  .cv .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .cv .stat2 b { font: 600 34px/1 "JetBrains Mono", monospace; }
  .cv .stat2 span { color: var(--muted); font-size: 13px; margin-left: 6px; }
  .cv .hot { border-color: var(--accent); }
  .cv .hot b { color: var(--accent-text); }
  .cv table { width: 100%; border-collapse: collapse; }
  .cv th { text-align: left; font: 500 11px "JetBrains Mono", monospace; letter-spacing: .1em; color: var(--faint); padding: 2px 10px 10px 0; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  .cv th .ym { margin-left: 8px; letter-spacing: 0; }
  .cv td { padding: 13px 10px 13px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
  .cv tr:last-child td { border-bottom: 0; }
  .cv tr.r { cursor: pointer; }
  .cv tr.r:hover td { background: var(--surface); }
  .cv td.nm { font-size: 16px; font-weight: 500; white-space: nowrap; padding-left: 6px; }
  .cv td.nm i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 10px; }
  .cv td.n { font: 400 21px "Noto Sans TC", sans-serif; text-align: right; padding-right: 22px; }
  .cv td .sub { color: var(--faint); font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cv table { table-layout: fixed; }
  .cv th:nth-child(1) { width: 150px; } .cv th:nth-child(2) { width: 80px; } .cv th:nth-child(4) { width: 190px; } .cv th:nth-child(5) { width: 90px; } .cv th:nth-child(6) { width: 110px; }
  .cv td .sb { height: 6px; border-radius: 3px; }
  .cv td.gap { color: var(--accent-text); font-size: 12px; white-space: nowrap; text-align: right; padding-right: 6px; }
  .cv td.gap.ok { color: var(--faint); }
  .cv svg.sp { width: 150px; height: 30px; display: block; overflow: visible; }

  /* ── overview B: rows ── */
  .rows { padding: 12px 28px; }
  .fam { display: grid; grid-template-columns: 150px 1fr auto; gap: 20px; align-items: center; padding: 16px 6px; border-top: 1px solid var(--line); }
  .fam:first-child { border-top: 0; }
  .fam .nm { font-size: 15px; font-weight: 600; }
  .fam .ct { font: 12px "JetBrains Mono", monospace; color: var(--faint); }
  .fam .strip { display: flex; gap: 10px; overflow: hidden; }
  .fam .strip .paper { flex: none; width: 108px; height: 66px; }
  .fam .lines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 13px; }
  .fam .att { font-size: 12px; color: var(--accent-text); white-space: nowrap; }

  /* a drawing always sits on white paper, inside its frame */
  .paper { background: #fff; border-radius: 8px; display: grid; place-items: center; overflow: hidden; min-width: 0; min-height: 0; }
  .paper img { width: 92%; height: 86%; object-fit: contain; display: block; min-width: 0; min-height: 0; }

  /* ── category page ── */
  .cat { display: grid; grid-template-columns: 180px minmax(320px, 1fr) minmax(380px, 44%); height: calc(100vh - 48px); }
  .cat.nodetail { grid-template-columns: 180px 1fr; }
  .tags { border-right: 1px solid var(--line); padding: 14px 10px; overflow: auto; }
  .tags h4 { font: 600 11px/1 "JetBrains Mono", monospace; color: var(--faint); letter-spacing: .08em; margin: 16px 6px 6px; }
  .tags h4:first-child { margin-top: 2px; }
  .tags button { display: flex; width: 100%; background: none; border: 0; color: var(--muted); padding: 4px 6px; border-radius: 6px; font: inherit; font-size: 13px; text-align: left; }
  .tags button span { margin-left: auto; font: 11px "JetBrains Mono", monospace; color: var(--faint); }
  .tags button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
  .tags button.child { padding-left: 20px; }
  .mid { overflow: auto; padding: 16px 20px 30px; }
  .mh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .mh h2 { margin: 0; font-size: 18px; white-space: nowrap; }
  .mh .cnt { color: var(--faint); font: 12px "JetBrains Mono", monospace; }
  .mh select { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px; }
  .sw { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; white-space: nowrap; }
  .sw a { padding: 5px 10px; font-size: 12px; color: var(--muted); }
  .sw a[aria-current] { background: var(--accent-soft); color: var(--text); }
  details.grp { border-top: 1px solid var(--line); }
  details.grp > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
  details.grp > summary::before { content: "▸"; color: var(--faint); font-size: 11px; width: 10px; }
  details.grp[open] > summary::before { content: "▾"; }
  details.grp > summary small { color: var(--faint); font: 400 12px "JetBrains Mono", monospace; }
  .row { display: grid; grid-template-columns: 60px minmax(120px, 1fr) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 6px 8px; border-radius: 8px; }
  .row:hover { background: var(--surface); }
  .row[aria-selected="true"] { background: var(--accent-soft); }
  .row .paper { width: 60px; height: 40px; border-radius: 5px; }
  .row .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .d { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.text { grid-template-columns: minmax(160px, 1.5fr) minmax(0, 1fr) auto; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; }
  .g { display: flex; gap: 4px; }
  .detail { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 18px 20px 30px; }
  .detail h3 { margin: 0; font-size: 16px; }
  .detail .stage { height: 230px; margin: 12px 0 6px; }
  .detail .k { font: 600 11px/1 "JetBrains Mono", monospace; color: var(--faint); letter-spacing: .08em; margin: 18px 0 7px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .lk { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; color: var(--muted); }
  .lk .paper { width: 48px; height: 32px; border-radius: 4px; flex: none; }
  .acts { display: flex; gap: 8px; margin-top: 20px; }
  .acts button { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 11px; font: inherit; font-size: 12px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .wall.lg { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
  .pc .paper { height: 124px; }
  .wall.lg .pc .paper { height: 220px; }
  .pc .cap { font-size: 12px; padding: 7px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc .cap b { color: var(--faint); font-weight: 400; }
  .wh { font-size: 13px; font-weight: 600; margin: 22px 0 10px; display: flex; gap: 8px; align-items: baseline; }
  .wh:first-of-type { margin-top: 4px; }
  .wh small { color: var(--faint); font: 400 12px "JetBrains Mono", monospace; }
</style>
</head>
<body>
<div class="tip" id="tip"></div>
<div class="pick" id="pick"></div>
<div class="hub">
  <header class="top"><b>L-Brain</b><input placeholder="搜尋全部知識"><span class="sp"></span><button class="ghostb">待同意 2</button><button class="plus">＋ 新增</button></header>
  <nav class="nav" id="nav"></nav>
  <main>
    <section class="v" id="v-dash"><div class="dash" id="dashEl"></div><div class="fake">草稿：數字是假的</div></section>
    <section class="v" id="v-dash4"><div class="cv" id="cvEl"></div><div class="fake">草稿：數字是假的</div></section>
    <section class="v" id="v-dash2"><div class="hud" id="hudEl"></div><div class="fake">草稿：數字是假的</div></section>
    <section class="v" id="v-dash3"><div class="sheet" id="sheetEl"></div><div class="fake">草稿：數字是假的</div></section>
    <section class="v" id="v-dashb"><div class="rows" id="rows"></div><div class="fake">草稿：流程圖的圖是流程圖工具實際畫的；其他類別的數字與文字是假的</div></section>
    <section class="v" id="v-list"><div class="cat" id="catList"></div></section>
    <section class="v" id="v-wall"><div class="cat nodetail" id="catWall"></div></section>
    <section class="v" id="v-cards"><div class="cat" id="catCards"></div></section>
  </main>
</div>
<script>
const ITEMS = /*ITEMS*/[];
const LVN = /*LV*/{};
const TOTAL = __N__;
const LV = { component: "元件", module: "模塊", figure: "流程圖" };
const by = (id) => ITEMS.find((x) => x.id === id) ?? ITEMS[0];
const img = (id) => `<img src="${by(id).src}" alt="">`;
const paper = (id, cls = "") => `<span class="paper ${cls}">${img(id)}</span>`;
const of = (lv) => ITEMS.filter((x) => x.lv === lv);
const view = () => (location.hash || "#dash4").slice(1);

function nav() {
  const v = view();
