<!doctype html>
<html lang="zh-Hant" data-theme="giftbox" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KnowledgeBase</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='6' cy='6' r='3' fill='%23ff6b35'/%3E%3Ccircle cx='18' cy='8' r='3' fill='%23ff6b35'/%3E%3Ccircle cx='10' cy='18' r='3' fill='%23ff6b35'/%3E%3Cpath d='M6 6 18 8 10 18Z' fill='none' stroke='%23ff6b35' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="prefs.css">
  <script src="theme.js"></script>
</head>
<body>
<div class="app">
  <header class="top"></header>

  <aside class="left" id="left" aria-label="導覽">
    <ol class="views" id="views">
      <li><button data-view="cards"><span data-icon="cards"></span><span class="t">知識卡</span><span class="count" id="cCards"></span></button></li>
      <li><button data-view="review"><span data-icon="target"></span><span class="t">複習</span><span class="count hot" id="cDue"></span></button></li>
      <li id="navPending" hidden><button data-view="pending"><span data-icon="layers"></span><span class="t">待審</span><span class="count hot" id="cPending"></span></button></li>
      <li><button data-view="timeline"><span data-icon="calendar"></span><span class="t">時間軸</span></button></li>
      <li><button data-view="graph"><span data-icon="graph"></span><span class="t">圖譜</span></button></li>
    </ol>

    <section class="filters" id="filters">
      <h4>篩選</h4>
      <label>時間
        <select id="fTime">
          <option value="">全部</option>
          <option value="1">今天</option>
          <option value="7">最近 7 天</option>
          <option value="30">最近 30 天</option>
          <option value="365">最近一年</option>
        </select>
      </label>
      <div class="seg" id="fDateField" role="group" aria-label="時間依據">
        <button data-v="created" aria-pressed="true">建立</button>
        <button data-v="updated">修改</button>
      </div>
      <label>熟悉度
        <select id="fState">
          <option value="">全部</option>
          <option value="due">到期待複習</option>
          <option value="learning">學習中</option>
          <option value="known">記得</option>
          <option value="stale">久未複習</option>
          <option value="none">尚無紀錄</option>
        </select>
      </label>
      <label>種類 <select id="fKind"><option value="">全部</option></select></label>
      <label>標籤 <select id="fTag"><option value="">全部</option></select></label>
      <label>空間 <select id="fSpace"><option value="">全部</option></select></label>
      <label>排序
        <select id="fSort">
          <option value="updated">最近修改</option>
          <option value="created">最近建立</option>
          <option value="title">標題</option>
          <option value="score">最不熟的先</option>
        </select>
      </label>
    </section>
    <div class="left-foot" id="spacesFoot"></div>
  </aside>

  <main class="page" id="page">
    <section class="view" data-view="cards">
      <div class="view-head"><h2>知識卡</h2><span class="muted" id="cardsInfo"></span></div>
      <div class="cards" id="cardList"></div>
    </section>

    <section class="view" data-view="pending" hidden>
      <div class="view-head"><h2>待審</h2><span class="muted" id="pendingInfo"></span></div>
      <div class="pending-list" id="pendingList"></div>
    </section>

    <section class="view" data-view="editor" hidden>
      <div class="view-head">
        <button class="ico" id="edBack" data-icon="back" aria-label="回到清單"></button>
        <h2 id="edHeading">新增知識卡</h2>
        <span class="muted mono" id="edMeta"></span>
        <div class="head-actions">
          <button class="btn" id="edGraph" hidden><span data-icon="graph"></span>在圖譜中查看</button>
          <span class="share" id="edShareWrap" hidden>
            <label class="share-to">分享到 <select id="edShareTo"></select></label>
            <button class="btn" id="edShare"><span data-icon="share"></span>分享</button>
          </span>
          <button class="ico" id="edDelete" data-icon="trash" aria-label="移到垃圾桶" hidden></button>
          <button class="btn" id="edDiscard" hidden><span data-icon="trash"></span>丟掉</button>
          <button class="btn primary" id="edSave"><span data-icon="check"></span>儲存</button>
        </div>
      </div>
      <div class="draft-bar" id="edDraftBar" role="status" hidden></div>
      <div class="draft-bar dup-bar" id="edDupBar" role="status" hidden></div>
      <div class="editor">
        <form class="ed-form" id="edForm" autocomplete="off">
          <div class="row2">
            <label>標題 <input id="edTitle" required placeholder="例：Dice coefficient"></label>
            <label>種類 <select id="edKind"></select></label>
          </div>
          <div class="row2">
            <label>別名（逗號分隔）<input id="edAliases" placeholder="DSC, Dice score"></label>
            <label>空間 <select id="edSpace"></select></label>
          </div>
          <div class="row2">
            <label>標籤（逗號分隔，可用 / 分層）<input id="edTags" placeholder="metric, deep-learning/cnn"></label>
            <label>領域 <input id="edDomains" placeholder="medical-image-analysis"></label>
          </div>
          <label>摘要 <textarea id="edSummary" rows="2" placeholder="一兩句話說明"></textarea></label>
          <label class="grow"><span class="lab-row">內文 <span class="lab-hint">Markdown＋LaTeX · <code>[[標題]]</code> 連到其他卡片 · 可貼上或拖曳圖片</span></span>
            <textarea id="edBody" rows="12" spellcheck="false"></textarea>
          </label>
          <div class="ed-tools">
            <button type="button" class="btn" id="edInsertLink"><span data-icon="link"></span>插入 [[連結]]</button>
            <button type="button" class="btn" id="edAddImage"><span data-icon="image"></span>加入圖片</button>
            <input type="file" id="edImageFile" accept="image/*,.pdf" hidden multiple>
          </div>
          <div class="ed-images" id="edImages"></div>
          <div class="ed-links">
            <div class="sub-head"><h4>明確連結</h4><button type="button" class="btn small" id="edAddLink"><span data-icon="plus"></span>新增連結</button></div>
            <ul id="edLinks"></ul>
          </div>
        </form>
        <div class="ed-preview">
          <div class="paper" id="edPreview"></div>
          <div class="side-block" id="edBacklinks"></div>
          <div class="side-block" id="edProgress"></div>
        </div>
      </div>
    </section>

    <section class="view" data-view="review" hidden>
      <div class="view-head"><h2>複習</h2><span class="muted" id="reviewInfo"></span></div>
      <div class="review" id="review"></div>
    </section>

    <section class="view" data-view="timeline" hidden>
      <div class="view-head"><h2>時間軸</h2>
        <select id="tlDays" aria-label="範圍"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option><option value="365">最近一年</option></select>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="view" data-view="graph" hidden>
      <div class="view-head"><h2>圖譜</h2>
        <span class="muted" id="graphInfo"></span>
        <div class="head-actions">
          <div class="seg" id="gMode" role="group" aria-label="圖譜範圍">
            <button data-v="global" aria-pressed="true">全部</button>
            <button data-v="local" aria-pressed="false">局部</button>
          </div>
          <label class="g-depth" id="gDepthWrap" hidden>深度 <input type="range" id="gDepth" min="1" max="3" step="1" value="2"> <output id="gDepthOut">2</output> 層</label>
        </div>
      </div>
      <div class="graph-wrap" id="graphWrap"><canvas id="graph"></canvas></div>
    </section>

  </main>
</div>

<dialog class="dialog small" id="picker" aria-label="選擇知識卡">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="pickerTitle">選擇知識卡</h2><button type="submit" value="cancel" class="ico close" data-icon="x" aria-label="關閉 Esc"></button></div>
    <div class="dlg-body">
      <div class="row2">
        <input id="pickerQ" type="search" placeholder="搜尋卡片…" autocomplete="off" aria-label="搜尋卡片">
        <select id="pickerRel" aria-label="連結類型"></select>
      </div>
      <ul class="pick-list" id="pickerList"></ul>
    </div>
  </form>
</dialog>

<dialog class="dialog small" id="draftDlg" aria-label="起草摘要">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2>起草摘要</h2><button type="submit" value="cancel" class="ico close" data-icon="x" aria-label="關閉 Esc"></button></div>
    <div class="dlg-body">
      <label>術語 <input id="draftTerm"></label>
      <label>上下文 <textarea id="draftCtx" rows="6"></textarea></label>
      <div class="err-text" id="draftErr" role="alert" hidden></div>
    </div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn" value="cancel">取消</button><button class="btn primary" id="draftGo" value="ok"><span data-icon="spark"></span>起草</button></div>
  </form>
</dialog>

<dialog class="dialog big" id="dlgNotation" aria-label="對照表">
  <div class="dlg">
    <div class="dlg-head">
      <h2>對照表</h2>
      <span class="chip" id="ntState" hidden></span>
      <button type="button" class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
    </div>
    <notation-panel id="ntPanel" mode="literal"></notation-panel>
  </div>
</dialog>

<!-- Gear tabs 提醒 / 郵件: cloned into the settings dialog when the tab opens. -->
<template id="tplNotify">
  <form class="set-form" id="setNotify" autocomplete="off" novalidate>
    <div class="set-head"><h3>到期通知</h3>
      <button type="button" class="help" data-tip="NeonDeck 的「知識」小工具會在這些時間檢查到期卡片並跳通知；NeonDeck 沒開時，由知識庫伺服器用 macOS 通知代替。同一個時段只會通知一次。" aria-label="到期通知的說明">?</button></div>
    <label>通知時間（逗號分隔，24 小時制）<input id="nTimes" placeholder="09:00, 21:00"></label>
    <p class="warn-text small" id="nTimesWarn" hidden>沒有通知時間：不會跳任何到期通知。</p>
    <label class="check"><input type="checkbox" id="nEnabled"> NeonDeck 沒開時，由知識庫顯示 macOS 通知</label>
    <div class="set-actions">
      <button type="submit" class="btn" id="nSave"><span data-icon="check"></span>儲存</button>
      <button type="button" class="btn" id="nTest"><span data-icon="alert"></span>測試通知</button>
      <span class="muted small" id="nState"></span>
    </div>
  </form>
</template>

<template id="tplEmail">
  <form class="set-form" id="setEmail" autocomplete="off" novalidate>
    <div class="set-head"><h3>每日 e-mail 摘要</h3>
      <button type="button" class="help" data-tip="每天寄一封：到期的問題（答案在信末）、最近學到的卡片、今日數字。手機連不回這台 Mac，所以信只是提醒，作答請回到 Mac。" aria-label="e-mail 摘要的說明">?</button>
      <label class="check head-toggle"><input type="checkbox" id="eEnabled"> 啟用</label></div>
    <div class="e-fields" id="eFields">
      <div class="row3">
        <label>SMTP 主機 <input id="eHost" placeholder="smtp.gmail.com"></label>
        <label>連接埠 <input id="ePort" type="number" min="1" max="65535" placeholder="587"></label>
        <label>加密
          <select id="eSecurity">
            <option value="starttls">STARTTLS（587）</option>
            <option value="tls">TLS（465）</option>
            <option value="none">不加密（僅本機轉送）</option>
          </select>
        </label>
      </div>
      <div class="row2">
        <label>帳號（Gmail 填完整地址）<input id="eUser" type="email" placeholder="you@gmail.com"></label>
        <label>寄件人（空白 = 帳號）<input id="eFrom" type="email"></label>
      </div>
      <label>收件人（逗號分隔）<input id="eTo" placeholder="you@gmail.com"></label>
      <div class="row3">
        <label>寄送時間 <input id="eAt" type="time"></label>
        <label>「最近學到」天數 <input id="eDays" type="number" min="1" max="60"></label>
        <label>最多幾題 <input id="eMax" type="number" min="1" max="200"></label>
      </div>
      <label class="check"><input type="checkbox" id="eSkip"> 沒有到期、也沒有新卡片的日子不寄</label>
      <div class="pw-row">
        <label>密碼（Gmail 請用「應用程式密碼」）<input id="ePw" type="password" autocomplete="new-password" placeholder="16 個字元，空格可留著"></label>
        <button type="button" class="btn" id="ePwSave"><span data-icon="lock"></span>儲存密碼</button>
      </div>
      <div class="pw-state"><p class="muted small" id="ePwState"></p>
        <button type="button" class="help" data-tip="Gmail：先開啟兩步驟驗證，再到 Google 帳戶 ▸ 安全性 ▸ 應用程式密碼 產生一組。密碼存在這台 Mac 的鑰匙圈（服務名稱 KnowledgeBase）；鑰匙圈無法使用時，改存在設定資料夾的 credentials.toml（只有你的帳號能讀）。不會寫進任何 repo。" aria-label="密碼存在哪裡">?</button></div>
    </div>
    <div class="set-actions">
      <button type="submit" class="btn" id="setSave"><span data-icon="check"></span>儲存</button>
      <a class="btn" id="ePreview" href="/api/reminders/preview" target="_blank" rel="noopener"><span data-icon="eye"></span>預覽今天的摘要</a>
      <button type="button" class="btn" id="eTest"><span data-icon="send"></span>寄測試信</button>
    </div>
    <p class="muted small" id="eState"></p>
  </form>
</template>

<script src="vendor/katex/katex.min.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
<script src="notation-panel.js"></script>
<script src="md.js"></script>
<script src="graph.js"></script>
<script src="app.js"></script>
</body>
</html>
