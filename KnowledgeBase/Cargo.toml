[workspace]
resolver = "3"
members = ["crates/server", "apps/desktop"]
# `cargo build` / `cargo test` skip the desktop app so they need no WebView
# libraries; build it with `cargo run -p knowledgebase` or `cargo tauri build`.
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
kb-core = { path = "../commons/crates/kb-core" }
lore-store = { path = "../commons/crates/lore-store" }
# SMTP app password in the Keychain (keyring only; no HTTP client, no OpenCC tables).
lore-secrets = { path = "../commons/crates/lore-secrets" }
lore-home = { path = "../commons/crates/lore-home" }
# Model calls (card drafts): local model first, Claude when chosen/available.
lore-llm = { path = "../commons/crates/lore-llm" }
# The shared UI kit (icons.js, base.css, shell.js) and the global notation registry (對照表).
lore-engines = { path = "../commons/crates/lore-engines" }
lore-shell = { path = "../commons/crates/lore-shell" }
lore-plot = { path = "../commons/crates/lore-plot" }
lore-notation = { path = "../commons/crates/lore-notation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tempfile = "3"
# Daily e-mail digest (Gmail SMTP with an app password); rustls, no OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
