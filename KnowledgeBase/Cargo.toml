[workspace]
resolver = "3"
members = ["crates/server"]
# Next: apps/desktop (Tauri shell), like PaperComposer / JELearner.

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
kb-core = { path = "../commons/crates/kb-core" }
ym-store = { path = "../commons/crates/ym-store" }
# SMTP app password in the Keychain (keyring only; no HTTP client, no OpenCC tables).
ym-secrets = { path = "../commons/crates/ym-secrets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tempfile = "3"
# Daily e-mail digest (Gmail SMTP with an app password); rustls, no OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
