# Glyph → LaTeX: the public default of LoreReader's symbol detection (symbols.rs).
#
# Pure typesetting data, the same for every paper. Overrides, read in this order (later
# wins): private/shared/glyphs.toml, then private/LoreReader/glyphs.toml (the 符號 panel's
# 「字形對照表…」 edits this one). Same format; only the entries you want to change.
#
# Unicode mathematical alphanumerics (𝑥 𝐱 𝒙 𝓛 𝔽 ℝ …, U+1D400–1D7FF) are mapped in code
# (italic → x, bold → \mathbf{x}, bold italic → \boldsymbol{x}, script → \mathcal{L},
# fraktur → \mathfrak{F}, double-struck → \mathbb{R}, sans → \mathsf, mono → \mathtt);
# an entry here overrides that too.

[glyphs]
# Greek (Unicode-math convention: ε = \varepsilon, ϵ = \epsilon, φ = \varphi, ϕ = \phi)
"α" = "\\alpha"
"β" = "\\beta"
"γ" = "\\gamma"
"δ" = "\\delta"
"ε" = "\\varepsilon"
"ϵ" = "\\epsilon"
"ζ" = "\\zeta"
"η" = "\\eta"
"θ" = "\\theta"
"ϑ" = "\\vartheta"
"ι" = "\\iota"
"κ" = "\\kappa"
"ϰ" = "\\varkappa"
"λ" = "\\lambda"
"μ" = "\\mu"
"µ" = "\\mu"
"ν" = "\\nu"
"ξ" = "\\xi"
"π" = "\\pi"
"ϖ" = "\\varpi"
"ρ" = "\\rho"
"ϱ" = "\\varrho"
"σ" = "\\sigma"
"ς" = "\\varsigma"
"τ" = "\\tau"
"υ" = "\\upsilon"
"φ" = "\\varphi"
"ϕ" = "\\phi"
"χ" = "\\chi"
"ψ" = "\\psi"
"ω" = "\\omega"
"Γ" = "\\Gamma"
"Δ" = "\\Delta"
"Θ" = "\\Theta"
"Λ" = "\\Lambda"
"Ξ" = "\\Xi"
"Π" = "\\Pi"
"Σ" = "\\Sigma"
"Υ" = "\\Upsilon"
"Φ" = "\\Phi"
"Ψ" = "\\Psi"
"Ω" = "\\Omega"
# letter-like symbols
"ℓ" = "\\ell"
"ℏ" = "\\hbar"
"ℎ" = "h"
"ı" = "\\imath"
"ȷ" = "\\jmath"
"ℵ" = "\\aleph"
"ℝ" = "\\mathbb{R}"
"ℕ" = "\\mathbb{N}"
"ℤ" = "\\mathbb{Z}"
"ℚ" = "\\mathbb{Q}"
"ℂ" = "\\mathbb{C}"
"ℙ" = "\\mathbb{P}"
"ℍ" = "\\mathbb{H}"
"ℒ" = "\\mathcal{L}"
"ℬ" = "\\mathcal{B}"
"ℰ" = "\\mathcal{E}"
"ℱ" = "\\mathcal{F}"
"ℋ" = "\\mathcal{H}"
"ℐ" = "\\mathcal{I}"
"ℳ" = "\\mathcal{M}"
"ℛ" = "\\mathcal{R}"
"ℯ" = "e"
"ℊ" = "g"
"ℴ" = "o"
"ℭ" = "\\mathfrak{C}"
"ℌ" = "\\mathfrak{H}"
"ℑ" = "\\mathfrak{I}"
"ℜ" = "\\mathfrak{R}"
"ℨ" = "\\mathfrak{Z}"
# operators, relations, delimiters
"∑" = "\\sum"
"∏" = "\\prod"
"∫" = "\\int"
"∮" = "\\oint"
"∂" = "\\partial"
"∇" = "\\nabla"
"∞" = "\\infty"
"−" = "-"
"∓" = "\\mp"
"±" = "\\pm"
"×" = "\\times"
"·" = "\\cdot"
"⋅" = "\\cdot"
"∗" = "\\ast"
"∘" = "\\circ"
"⊙" = "\\odot"
"⊗" = "\\otimes"
"⊕" = "\\oplus"
"≤" = "\\leq"
"≥" = "\\geq"
"≠" = "\\neq"
"≈" = "\\approx"
"≃" = "\\simeq"
"∼" = "\\sim"
"≡" = "\\equiv"
"∝" = "\\propto"
"∈" = "\\in"
"∉" = "\\notin"
"∋" = "\\ni"
"⊂" = "\\subset"
"⊆" = "\\subseteq"
"⊃" = "\\supset"
"⊇" = "\\supseteq"
"∪" = "\\cup"
"∩" = "\\cap"
"∖" = "\\setminus"
"∅" = "\\emptyset"
"∀" = "\\forall"
"∃" = "\\exists"
"¬" = "\\neg"
"∧" = "\\wedge"
"∨" = "\\vee"
"→" = "\\to"
"←" = "\\leftarrow"
"↦" = "\\mapsto"
"⇒" = "\\Rightarrow"
"⇔" = "\\Leftrightarrow"
"⟨" = "\\langle"
"⟩" = "\\rangle"
"‖" = "\\|"
"∥" = "\\|"
"⌊" = "\\lfloor"
"⌋" = "\\rfloor"
"⌈" = "\\lceil"
"⌉" = "\\rceil"
"⊤" = "\\top"
"⊥" = "\\perp"
"′" = "\\prime"
"″" = "\\prime\\prime"
"…" = "\\ldots"
"⋯" = "\\cdots"

# Accents drawn as their own glyph over a letter (matched by position).
[accents]
"ˆ" = "hat"
"^" = "hat"
"̂" = "hat"
"˜" = "tilde"
"~" = "tilde"
"̃" = "tilde"
"¯" = "bar"
"ˉ" = "bar"
"̄" = "bar"
"‾" = "bar"
"˙" = "dot"
"̇" = "dot"
"¨" = "ddot"
"̈" = "ddot"
"⃗" = "vec"
"ˇ" = "check"
"˘" = "breve"

# Extra font-name fragments to treat as math fonts (uppercase, no spaces). The built-in
# list covers Computer Modern / Latin Modern (CMMI, CMSY, CMEX, MSAM, MSBM, LMMath…),
# STIX / STIX Two Math, Cambria Math, XITS Math, TeX Gyre … Math, New CM Math, Euler.
[fonts]
math = []
