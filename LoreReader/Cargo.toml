[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "apps/desktop"]
# `cargo build` / `cargo test` skip the desktop app so they need no WebView
# libraries; build it with `cargo run -p lorereader` or `cargo tauri build`.
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lore-home = { path = "../commons/crates/lore-home" }
lore-llm = { path = "../commons/crates/lore-llm" }
lore-notation = { path = "../commons/crates/lore-notation" }
lore-shell = { path = "../commons/crates/lore-shell" }
lore-engines = { path = "../commons/crates/lore-engines" }
lore-plot = { path = "../commons/crates/lore-plot" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# PDF page operations (MIT). No default features: no date crates, no rayon.
lopdf = { version = "0.42", default-features = false }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
