[package]
name = "lorereader"
version.workspace = true
edition.workspace = true
description = "LoreReader desktop app"

# Desktop shell: starts the local server in-process on 127.0.0.1:7890 (the port the
# KnowledgeBase links point to; a free port when 7890 is taken by something else) and
# opens a native window on it (WKWebView on macOS). Printing uses the webview's native
# print dialog on print.html.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lr-server = { path = "../../crates/server" }
lr-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
serde_json.workspace = true
tauri-plugin-dialog = "2"
