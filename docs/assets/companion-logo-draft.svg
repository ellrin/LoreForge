<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0B33"/>
      <stop offset="0.6" stop-color="#0C0619"/>
      <stop offset="1" stop-color="#05030C"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="12" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- the head outline, reused for the ghosts -->
    <path id="head" d="M512 262 C646 262 722 330 724 440 L718 548 C714 616 680 668 628 704 L576 742 L448 742 L396 704 C344 668 310 616 306 548 L300 440 C302 330 378 262 512 262 Z"/>
    <path id="collar" d="M396 730 L276 870 M628 730 L748 870 M276 870 L332 960 M748 870 L692 960 M436 770 L512 830 L588 770"/>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#haze)"/>
    <g fill="#FFFFFF" fill-opacity="0.035">
      <rect x="0" y="120" width="1024" height="6"/>
      <rect x="0" y="240" width="1024" height="6"/>
      <rect x="0" y="360" width="1024" height="6"/>
      <rect x="0" y="480" width="1024" height="6"/>
      <rect x="0" y="600" width="1024" height="6"/>
      <rect x="0" y="720" width="1024" height="6"/>
    </g>
  </g>

  <!-- chromatic-aberration ghosts -->
  <g fill="none" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" opacity="0.6">
    <g stroke="#FF2BD6" transform="translate(-10 0)"><use href="#head"/><use href="#collar"/></g>
    <g stroke="#00F0FF" transform="translate(10 0)"><use href="#head"/><use href="#collar"/></g>
  </g>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <!-- head and collar -->
    <g stroke="#B8FBFF" stroke-width="18"><use href="#head"/><use href="#collar"/></g>
    <!-- swept hair crest -->
    <g stroke="#FCEE0A" stroke-width="16"><path d="M352 330 C392 214 520 168 664 214"/><path d="M420 300 C470 220 580 206 690 262"/><path d="M500 276 C560 230 640 236 704 300"/><path d="M380 296 C376 250 396 214 430 196"/></g>
    <!-- forehead seam -->
    <polyline stroke="#FF2BD6" stroke-width="12" points="612,318 642,350 624,386 650,404"/>
    <!-- goggles: side brackets, bridge, lenses -->
    <g stroke="#B8FBFF" stroke-width="14">
      <polyline points="300,428 344,428 344,484 300,484"/>
      <polyline points="724,428 680,428 680,484 724,484"/>
      <line x1="498" y1="456" x2="526" y2="456"/>
    </g>
    <g stroke="#FCEE0A" stroke-width="18" fill="#0A0616">
      <circle cx="432" cy="456" r="66"/>
      <circle cx="592" cy="456" r="66"/>
    </g>
    <!-- jaw plates -->
    <polyline stroke="#00F0FF" stroke-width="14" points="384,612 444,690 512,702 580,690 640,612"/>
    <line stroke="#00F0FF" stroke-width="12" x1="444" y1="690" x2="456" y2="740"/>
    <line stroke="#00F0FF" stroke-width="12" x1="580" y1="690" x2="568" y2="740"/>
    <!-- goatee -->
    <polyline stroke="#FCEE0A" stroke-width="12" points="490,742 512,806 534,742"/>
    <!-- ear studs -->
    <g stroke="#FF2BD6" stroke-width="10"><line x1="740" y1="512" x2="740" y2="524"/><line x1="740" y1="542" x2="740" y2="554"/></g>
  </g>
  <!-- pupils -->
  <g fill="#FCEE0A" filter="url(#glow)"><circle cx="436" cy="462" r="14"/><circle cx="588" cy="462" r="14"/></g>

  <!-- glitch slice -->
  <rect x="660" y="586" width="128" height="14" fill="#FF2BD6" opacity="0.9"/>
  <rect x="236" y="640" width="76" height="8" fill="#00F0FF" opacity="0.9"/>
</svg>
