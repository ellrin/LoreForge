<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="How the apps connect: L-Reader and L-Shelf feed L-Brain; L-Paper, L-Slide, L-Echo and L-Deck read it.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150A2B"/><stop offset="1" stop-color="#07040F"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FF2BD6" fill-opacity="0.22"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <path d="M260 80 L490 180" stroke="#00F0FF" stroke-width="2.5" fill="none" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;-64" dur="2s" repeatCount="indefinite"/></path><path d="M260 280 L490 180" stroke="#00F0FF" stroke-width="2.5" fill="none" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;-64" dur="2s" repeatCount="indefinite"/></path><path d="M1020 80 L790 180" stroke="#FF2BD6" stroke-width="2.5" fill="none" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;64" dur="2s" repeatCount="indefinite"/></path><path d="M1020 280 L790 180" stroke="#FF2BD6" stroke-width="2.5" fill="none" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;64" dur="2s" repeatCount="indefinite"/></path><path d="M400 296 L520 232" stroke="#FCEE0A" stroke-width="2.5" fill="none" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;-64" dur="2s" repeatCount="indefinite"/></path><path d="M880 296 L760 232" stroke="#FCEE0A" stroke-width="2.5" fill="none" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.9"><animate attributeName="stroke-dashoffset" values="0;64" dur="2s" repeatCount="indefinite"/></path>
  <g filter="url(#glow)"><rect x="490" y="128" width="300" height="104" rx="16" fill="#0A0616" stroke="#FCEE0A" stroke-width="3.5"/></g>
  <text x="640" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" letter-spacing="6" fill="#FCEE0A" text-anchor="middle">L-BRAIN</text>
  <text x="640" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#F4FEFF" text-anchor="middle">your own knowledge base</text>
  <circle cx="640" cy="128" r="5" fill="#FCEE0A"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <g><rect x="40" y="46" width="220" height="68" rx="12" fill="#0A0616" stroke="#00F0FF" stroke-width="2.5"/><text x="150" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#00F0FF" text-anchor="middle">L-READER</text><text x="150" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B3D6" text-anchor="middle">read papers</text></g><g><rect x="40" y="246" width="220" height="68" rx="12" fill="#0A0616" stroke="#00F0FF" stroke-width="2.5"/><text x="150" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#00F0FF" text-anchor="middle">L-SHELF</text><text x="150" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B3D6" text-anchor="middle">find files</text></g><g><rect x="1020" y="46" width="220" height="68" rx="12" fill="#0A0616" stroke="#FF2BD6" stroke-width="2.5"/><text x="1130" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#FF2BD6" text-anchor="middle">L-PAPER</text><text x="1130" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B3D6" text-anchor="middle">write papers</text></g><g><rect x="1020" y="246" width="220" height="68" rx="12" fill="#0A0616" stroke="#FF2BD6" stroke-width="2.5"/><text x="1130" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#FF2BD6" text-anchor="middle">L-SLIDE</text><text x="1130" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B3D6" text-anchor="middle">make decks</text></g><g><rect x="290" y="296" width="220" height="68" rx="12" fill="#0A0616" stroke="#FCEE0A" stroke-width="2.5"/><text x="400" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#FCEE0A" text-anchor="middle">L-ECHO</text><text x="400" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B3D6" text-anchor="middle">ask &amp; review</text></g><g><rect x="770" y="296" width="220" height="68" rx="12" fill="#0A0616" stroke="#FCEE0A" stroke-width="2.5"/><text x="880" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="3" fill="#FCEE0A" text-anchor="middle">L-DECK</text><text x="880" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B9B3D6" text-anchor="middle">glance &amp; recall</text></g>
  <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#00F0FF">IN ▸ what you read and keep</text>
  <text x="1240" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#FF2BD6" text-anchor="end">OUT ▸ what you make from it</text>
</svg>
