<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>繪圖樣式一覽</title>
<!-- Every sample figure (synthetic data) in one style: ?style=<id>&zoom=2&only=<sample id>.
     Works from `python3 -m http.server` in commons/ui (open /plot/gallery.html). -->
<style>
  body { margin: 0; padding: 24px; background: #e9e9ec; font: 13px system-ui, sans-serif; color: #222; }
  h1 { font-size: 16px; margin: 0 0 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  figure { margin: 0; background: #fff; box-shadow: 0 1px 4px #0002; }
  figcaption { padding: 6px 10px; font-size: 12px; color: #555; background: #f6f6f6; }
  .fig svg { display: block; }
  .warn { color: #b00; padding: 4px 10px; }
  .pair { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; width: 100%; padding-bottom: 8px; border-bottom: 1px solid #ccc; }
  .pair h3 { width: 100%; margin: 6px 0 0; font-size: 13px; }
</style>
<!-- mathsvg.js: next to this page under /plot/, one folder up in commons/ui -->
<script>document.write('<script src="' + (/\/ui\/plot\//.test(location.pathname) ? "../" : "") + 'mathsvg.js"><\/script>');</script>
<script src="plot.js"></script>
<script src="charts.js"></script>
<script src="charts3d.js"></script>
<script src="eqcore.js"></script>
<script src="simcore.js"></script>
<script src="equation.js"></script>
<script src="eqlive.js"></script>
<script src="eqsim.js"></script>
<script src="formats.js"></script>
<script src="samples.js"></script>
</head>
<body>
<h1 id="h"></h1>
<div class="grid" id="grid"></div>
<script>
// From commons/ui (python3 -m http.server): the public styles. Under an app's /plot/ (?api=1): the
// styles the server lists, the author's private ones included.
const q = new URLSearchParams(location.search);
if (!q.get("api")) LorePlot.katexBase = "../notation-panel/vendor/katex/";
(async () => {
  const id = q.get("style") || "clean";
  const zoom = +(q.get("zoom") || 2);
  const styles = q.get("api")
    ? (await (await fetch("api/styles")).json()).styles
    : await Promise.all((await (await fetch("styles/index.json")).json()).map(async (i) => (await fetch(`styles/${i}.json`)).json()));
  const st = styles.find((s) => s.id === id);
  document.getElementById("h").textContent = `${st?.label ?? id} — ${st?.note ?? ""}`;
  const grid = document.getElementById("grid");
  const only = (q.get("only") || "").split(",").filter(Boolean);
  for (const s of await LorePlotSamples.all(id, styles)) {
    if (only.length && !only.some((o) => s.id === o || (o.endsWith("*") && s.id.startsWith(o.slice(0, -1))))) continue;
    // ?compare=<style>: the same figure in that style first (之前), then in ?style (之後)
    if (q.get("compare")) {
      const row = document.createElement("div");
      row.className = "pair";
      const head = document.createElement("h3");
      head.textContent = s.label;
      row.append(head);
      for (const [sid, word] of [[q.get("compare"), "之前"], [id, "之後"]]) {
        const spec = { ...s.spec, style: sid };
        const r = await LorePlot.render(spec, { styles });
        const f = document.createElement("figure");
        f.innerHTML = r.svg;
        const svg = f.firstChild;
        svg.style.width = `${r.w * zoom * 96 / 25.4}px`;
        svg.style.height = `${r.h * zoom * 96 / 25.4}px`;
        svg.style.display = "block";
        const cap = document.createElement("figcaption");
        cap.textContent = `${word}（${styles.find((x) => x.id === sid)?.label ?? sid}）`;
        f.append(cap);
        row.append(f);
      }
      grid.append(row);
      continue;
    }
    const r = await LorePlot.render(s.spec, { styles });
    const f = document.createElement("figure");
    const box = document.createElement("div");
    box.className = "fig";
    box.innerHTML = r.svg;
    const svg = box.firstChild;
    svg.style.width = `${r.w * zoom * 96 / 25.4}px`;
    svg.style.height = `${r.h * zoom * 96 / 25.4}px`;
    const cap = document.createElement("figcaption");
    cap.textContent = `${s.label} · ${r.w}×${r.h} mm`;
    f.dataset.id = s.id;
    f.append(box, cap);
    for (const w of r.warnings) { const d = document.createElement("div"); d.className = "warn"; d.textContent = w; f.append(d); }
    grid.append(f);
  }
  document.body.dataset.ready = "1";
})().catch((e) => { document.body.textContent = "錯誤：" + e.stack; document.body.dataset.ready = "1"; });
</script>
</body>
</html>
