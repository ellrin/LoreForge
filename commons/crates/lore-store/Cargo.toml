[package]
name = "lore-store"
version.workspace = true
edition.workspace = true
description = "Data tiers and spaces (personal / household), member-scoped paths, content-addressed assets (iCloud Drive or git folder)."

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
dirs = "6"
# Household assets are re-encoded to webp (lossless; the `image` crate has no lossy webp encoder).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
tempfile = "3"
