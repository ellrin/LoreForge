[package]
name = "kb-core"
version.workspace = true
edition.workspace = true
description = "Knowledge base core: nodes, edges, tags, per-member learning state, SQLite/FTS5 index, term scanner."

[dependencies]
ym-store = { path = "../ym-store" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
chrono.workspace = true
# 0.32 shares libsqlite3-sys 0.30 with sqlx 0.8 (only one `sqlite3` link per build).
rusqlite = { version = "0.32", features = ["bundled"] }
aho-corasick = "1"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
