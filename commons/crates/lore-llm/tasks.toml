# LLM tasks (design §9). Every LLM job in every app is a task: it declares
# what it needs, and lore-llm's router picks a model that satisfies it.
#
#   [task.<id>]
#   label    = "shown in the UI and in errors"
#   needs    = { json = true, vision = false, web = false, context = 32000, streaming = false }
#   default  = "claude:sonnet"        # model ref (see below)
#   fallback = "local:gemma-4-12b-q8" # tried when the default is unavailable or offline
#   offline  = true                   # may run without internet (needs a local candidate);
#                                     # false = disabled offline, with an explanation;
#                                     # unset = true when any candidate is local
#   effort   = "medium"               # Claude effort for this task (optional)
#   max_tokens = 8000                 # optional
#
# Model refs:
#   claude:<alias|id>       Claude, subscription or API key (app setting decides; aliases in catalog.json)
#   claude-api:<alias|id>   Claude through the API key only
#   claude-code:<alias|id>  Claude through the subscription (Claude Code) only
#   local:<catalog id>      llama-server with a catalog model; an id prefix also works
#                           (local:gemma-4-12b → the first downloaded gemma-4-12b-*)
#   mock:<name>             tests
#
# Users override a task's model in their own tasks.toml (same format):
#
#   [override]
#   kb-summarize-card = "claude:haiku"

# ── KnowledgeBase ──────────────────────────────────────────

[task.kb-summarize-card]
label = "整理成知識卡"
needs = { json = true }
default = "local:qwen3.5-9b-q8"
fallback = "claude:haiku"
offline = true

[task.kb-extract-terms]
label = "術語抽取"
needs = { json = true }
default = "local:qwen3.5-9b-q8"
fallback = "claude:haiku"
offline = true

# ── SlideComposer ──────────────────────────────────────────

[task.sc-slide-content]
label = "逐頁生成投影片內容"
needs = { json = true, context = 32000 }
default = "claude:sonnet"
fallback = "local:gemma-4-12b-q8"
offline = true

[task.sc-crop-modules]
label = "從架構圖標出子模組框"
needs = { vision = true, json = true }
default = "claude:sonnet"
fallback = "local:gemma-4-12b-q8"

# ── Research ───────────────────────────────────────────────

[task.research-web]
label = "搜尋與下載文獻"
needs = { web = true }
default = "claude:sonnet"
offline = false

# ── PaperComposer ──────────────────────────────────────────

[task.pc-compose-paragraph]
label = "撰寫段落"
needs = { json = true, context = 32000 }
default = "claude:sonnet"
fallback = "local:gemma-4-12b-q8"
offline = true

# ── Reader / chat panel ────────────────────────────────────

[task.reader-chat]
label = "閱讀時提問"
needs = { streaming = true, context = 32000 }
default = "claude-api:sonnet"
fallback = "local:qwen3.5-9b-q8"
effort = "low"
offline = true

# ── JELearner (decisions §19: two models by task) ─────────

[task.jl-generate]
label = "產生課程"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:gemma-4-12b-q8"
offline = true

[task.jl-realtime]
label = "對話即時回覆"
needs = { json = true }
default = "claude:haiku"
fallback = "local:gemma-4-12b-q8"
effort = "low"
offline = true
