[package]
name = "lore-know"
version.workspace = true
edition.workspace = true
description = "The author's private know-how as one database: formats, categories, sources, items; text records with a SQLite index (docs/brain-hub.md)."

[dependencies]
lore-flow = { path = "../lore-flow" }
lore-canvas = { path = "../lore-canvas" }
lore-home = { path = "../lore-home" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
csv.workspace = true
thiserror.workspace = true
chrono.workspace = true
# same version as kb-core (one `sqlite3` link per build)
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
