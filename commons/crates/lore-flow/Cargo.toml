[package]
name = "lore-flow"
description = "Flow / architecture figures: a data-flow graph (L1, written by hand or by an LLM) is laid out, routed and built into lore-canvas objects"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["llm", "web"]
# The LLM task (description → graph) and the command-line tool.
llm = ["dep:lore-llm", "dep:tokio", "dep:async-trait"]
# The shared editor: /flow/* routes (axum), the discussion and assistant tasks.
web = ["llm", "dep:axum", "dep:lore-home"]

[dependencies]
lore-canvas = { path = "../lore-canvas" }
lore-notation = { path = "../lore-notation" }
lore-ooxml = { path = "../lore-ooxml" }
lore-math = { path = "../lore-math" }
lore-llm = { path = "../lore-llm", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
lore-home = { path = "../lore-home", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
lore-shell = { path = "../lore-shell" }

[[bin]]
name = "lore-flow"
path = "src/bin/lore-flow.rs"
required-features = ["llm"]
