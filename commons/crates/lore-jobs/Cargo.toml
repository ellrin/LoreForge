[package]
name = "lore-jobs"
description = "Long-running background jobs: stages in order, one checkpoint file per stage, progress, stop/resume, a review wait, redo from a stage"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }
