[package]
name = "lore-plot"
description = "The shared plotting tool (繪圖): figure spec, data import (CSV/TSV/JSON/XLSX/LaTeX tables), style presets (public + private through lore-home), export (headless Chrome PDF, SVG, PNG with the spec inside), the plot-propose LLM task and the /plot routes every app mounts."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
lore-home = { path = "../lore-home" }
lore-llm = { path = "../lore-llm", default-features = false }
lore-docsrc = { path = "../lore-docsrc" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
lore-shell = { path = "../lore-shell" }
lore-notation = { path = "../lore-notation" }
