[package]
name = "lore-modeld"
version.workspace = true
edition.workspace = true
description = "The shared local-model broker: one small background process per machine owns the llama-server, proxies OpenAI-compatible requests from every app and decides who goes first (focused app, interactive, background)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "lore-modeld"
path = "src/main.rs"

[dependencies]
lore-llm = { path = "../lore-llm" }
lore-home = { path = "../lore-home" }
lore-engines = { path = "../lore-engines" }
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
