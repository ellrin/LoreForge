[package]
name = "sc-server"
version.workspace = true
edition.workspace = true

# Local server on 127.0.0.1:7880: serves web/ and the JSON API. Handlers are plain
# async fns over `Shared` so they can become Tauri commands later.

[dependencies]
sc-core = { path = "../core" }
ym-canvas.workspace = true
ym-ooxml.workspace = true
ym-math.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
