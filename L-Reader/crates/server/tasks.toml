# L-Reader's LLM tasks, layered over lore-llm's shared tasks.toml. A user file
# `<settings folder>/LoreReader/tasks.toml` in the same format can add an `[override]`.
#
#   local:current     the local engine that is connected: the OpenAI-compatible server
#                     in config.toml `[engine] url` (or LOREREADER_LLM_URL)
#   claude:selected   the Claude model from config.toml `claude_model` (else the catalog
#                     default); the subscription (Claude Code) first, then the API key
#
# Same order as L-Paper's writing tasks: translation runs locally first and falls
# back to Claude; the chat panel is Claude only. Term classification and paragraph
# analysis ask Haiku first (llm.rs `CLOUD_FIRST`, also ahead of the shared 整理 route's
# local-first order) and use the local model when Claude cannot run; both run only when
# the author presses their button, never on opening a paper. A card draft (`lr-card`)
# needs web search, so it is Claude only and is refused without a search.
# The model menu (工具列「模型」) picks local / Haiku / Sonnet / Opus per task; that choice is
# stored in private/LoreReader/models.json and is that engine or an error, never a fallback.

[task.lr-translate]
label = "翻譯"
class = "tidy"
default = "local:current"
fallback = "claude:selected"
offline = true

[task.lr-chat]
label = "問 Claude"
class = "ask"
# 16k is enough for a paragraph, its definitions and 20 turns; also lets the model menu
# pick a local engine for the chat.
needs = { context = 16000 }
default = "claude:selected"
# 問答 (class ask): with the shared routes installed the local model comes first and
# answers offline; without them the chat is Claude only, as before.
offline = true

[task.lr-classify-terms]
label = "名詞分類"
class = "tidy"
needs = { context = 16000 }
default = "claude:haiku"
fallback = "local:current"
max_tokens = 8000

[task.lr-paragraph]
label = "段落分析"
class = "tidy"
needs = { context = 8000 }
default = "claude:haiku"
fallback = "local:current"
max_tokens = 1500

[task.lr-card]
label = "知識卡摘要（上網查）"
needs = { web = true }
default = "claude:sonnet"
fallback = "claude:haiku"
offline = false
max_tokens = 2000
