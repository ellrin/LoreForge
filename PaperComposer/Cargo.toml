[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "apps/desktop"]
# `cargo build` / `cargo test` skip the desktop app so they need no WebView
# libraries; build it with `cargo run -p papercomposer` or `cargo tauri build`.
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
thiserror = "2"
# Shared crates (commons/, next to this app's folder).
lore-llm = { path = "../commons/crates/lore-llm" }
lore-gitsync = { path = "../commons/crates/lore-gitsync" }
lore-home = { path = "../commons/crates/lore-home" }
lore-notation = { path = "../commons/crates/lore-notation" }
lore-notes = { path = "../commons/crates/lore-notes" }
lore-shell = { path = "../commons/crates/lore-shell" }
lore-engines = { path = "../commons/crates/lore-engines" }
lore-fonts = { path = "../commons/crates/lore-fonts" }
# 知識卡 (kb.rs): KnowledgeBase's cards, read-only.
kb-core = { path = "../commons/crates/kb-core" }
lore-store = { path = "../commons/crates/lore-store" }
lore-plot = { path = "../commons/crates/lore-plot" }
lore-flow = { path = "../commons/crates/lore-flow" }
# 寫書 (crates/server/src/book): the job runner, web search for open-access papers, PDF material,
# KnowledgeBase terms and LoreReader's files.
lore-jobs = { path = "../commons/crates/lore-jobs" }
lore-research = { path = "../commons/crates/lore-research" }
lore-docsrc = { path = "../commons/crates/lore-docsrc" }
lore-learn = { path = "../commons/crates/lore-learn" }
# 潤飾 (crates/server/src/polish.rs): the shared /api/polish routes; the voice for its hold-to-talk.
lore-polish = { path = "../commons/crates/lore-polish" }
lore-voice = { path = "../commons/crates/lore-voice" }
