<!doctype html>
<html lang="zh-Hant" data-theme="giftbox" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperComposer</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="prefs.css">
  <link rel="stylesheet" href="paper-start.css">
  <link rel="stylesheet" href="draft-engine.css">
  <link rel="stylesheet" href="review-word.css">
  <script src="theme.js"></script>
</head>
<body>
<div class="app at-home">
  <!-- the shared Lore shell fills it (frame.js: LoreShell.mount) -->
  <header class="top"></header>
  <!-- 寫作｜審閱 (review.js): goes into the top bar's lead slot -->
  <div class="seg modes" id="modeSwitch" role="group" aria-label="模式" hidden></div>

  <aside class="left" aria-label="導覽">
    <div class="nav-head">
      <h2 class="panel-title" id="navTitle"></h2>
      <button class="ico small" id="navOpenAll" data-icon="chevron" aria-label="全部展開" title="Alt＋點標題：展開或收合整個分支"></button>
      <button class="ico small" id="navCloseAll" data-icon="up" aria-label="全部收合"></button>
    </div>
    <ol class="nav" id="nav"></ol>
  </aside>

  <main class="page-area" id="pageArea">
    <div class="writebar capsule" id="writebar" role="toolbar" aria-label="寫作工具"></div>
    <div class="keyvalue" id="keyValue" hidden></div>
    <article class="paper" id="paper"></article>
    <div class="statusbar" id="statusbar"></div>
  </main>

  <!-- start screen (home.js): over the page and side panels, under the top bar -->
  <!-- shown from the first paint: boot() fills it after loading, so the empty editor never flashes -->
  <section class="home" id="home" aria-label="封面"></section>

  <aside class="right" aria-label="寫作助手">
    <!-- 寫作 starts folded: its head is the one button that opens it -->
    <section class="block compose" data-open="false">
      <div class="block-head">
        <span class="n">01</span><h3>寫作</h3>
        <button class="help" data-tip="條列重點，一行一點；以 ! 開頭表示強調。模型只能用你句型庫裡的寫法組成段落。模型會參考目前段落與下一段，寫出能接在兩段之間的段落。">?</button>
        <button class="toggle" aria-label="展開或收合">+</button>
      </div>
      <div class="block-body">
        <div class="cond">
          <label><span>章節</span><select id="cSection"></select></label>
          <label><span>功能</span><select id="cFunction"><option value="">自動</option></select></label>
          <label><span>字數</span><span class="range"><input id="cMin" type="number" min="20" step="10" value="120"><i>–</i><input id="cMax" type="number" min="20" step="10" value="180"></span></label>
          <label><span>語言</span><span class="seg" id="cLang"><button data-v="en" aria-pressed="true">EN</button><button data-v="zh" aria-pressed="false">中</button></span></label>
          <label class="span2"><span>引擎</span><span class="seg" id="cEngine"><button data-v="local"><span class="lbl">本機</span><span data-icon="chevron"></span></button><button data-v="claude"><span class="lbl">Claude</span><span data-icon="chevron"></span></button></span></label>
        </div>
        <textarea id="points" rows="5" placeholder="- ! 主要發現&#10;- 次要重點"></textarea>
        <button class="primary" id="generate"><span>生成</span><kbd>Ctrl ↵</kbd></button>
        <div id="result"></div>
      </div>
    </section>

    <section class="block" data-open="true">
      <div class="block-head">
        <span class="n">02</span><h3>檢查</h3>
        <button class="help" data-tip="選到的段落會帶進來。格式規則即時檢查；資料庫「規則」裡的軟規則，按「檢查」才交給模型判讀。">?</button>
        <button class="toggle" aria-label="展開或收合">−</button>
      </div>
      <div class="block-body"><div class="chk-head" id="chkHead"></div><ul class="findings" id="findings"></ul><div id="softBox"></div></div>
    </section>
  </aside>

  <!-- Workspace windows: open over the paper, Esc or the backdrop closes them -->
  <dialog class="dialog big" id="dlgDb" aria-label="資料庫">
    <div class="dlg">
      <div class="dlg-head">
        <h2>資料庫</h2>
        <div class="tabs" id="dbTabs" role="tablist"></div>
        <span class="chip" id="profileName"></span>
        <button class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
      </div>
      <div class="db">
      <div class="db-main">
        <div class="db-bar">
          <input type="search" id="dbFilter" placeholder="篩選">
          <select id="dbSection" aria-label="章節"><option value="">全部章節</option></select>
          <span class="dirty" id="dbDirty" hidden>未儲存</span>
          <button class="ico" id="dbAdd" data-icon="plus" aria-label="新增一列"></button>
          <button class="ico" id="dbSave" data-icon="save" aria-label="儲存 ⌘S"></button>
        </div>
        <div class="db-issues" id="dbIssues"></div>
        <div class="grid-wrap"><table class="grid" id="dbGrid"></table></div>
      </div>
      <aside class="db-side">
        <div class="block-head">
          <span class="n">↯</span><h3>拆解</h3>
          <button class="help" data-tip="貼上欣賞的句子或段落，Claude 會拆成句型、開頭連接詞與片語。勾選要的項目加入資料庫，再按儲存。">?</button>
        </div>
        <textarea id="dcText" rows="7" placeholder="貼上句子或段落"></textarea>
        <div class="row">
          <select id="dcSection" aria-label="章節"></select>
          <button class="primary small" id="dcRun">拆解</button>
        </div>
        <div id="dcOut"></div>
      </aside>
    </div>
      <div class="refs-pane" id="refsPane" hidden>
        <div class="refs-head"><span class="count" id="refsCount"></span><button class="help" data-tip="書目存在私人工作區的 refs/library.bib，一句話、簡介、標籤存在 refs/notes.csv，都會同步。PDF 只存在這台電腦的 PDF 資料夾，不上 git。點標題展開簡介。">?</button></div>
        <div class="refs" id="refsBody"></div>
      </div>
    </div>
  </dialog>

  <dialog class="dialog big" id="dlgTpl" aria-label="模板">
    <div class="dlg">
      <div class="dlg-head">
        <h2>期刊模板</h2>
        <button class="help" data-tip="一個期刊一個模板，存在工作區的 publishers/〈名稱〉/：class、樣式檔、範例 sample.tex，以及期刊資料 template.toml。新期刊從現有模板複製後微調。">?</button>
        <button class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
      </div>
      <div class="tpl-body" id="publishers"></div>
    </div>
  </dialog>

  <dialog class="dialog" id="dlgNew" aria-label="新論文">
    <div class="dlg">
      <div class="dlg-head">
        <h2>新論文</h2>
        <button class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
      </div>
      <div class="np-body" id="npBody"></div>
      <div class="np-foot" id="npFoot"></div>
    </div>
  </dialog>

  <!-- 討論草稿: the draft interview for the open paper -->
  <dialog class="dialog big" id="dlgDraft" aria-label="討論草稿">
    <div class="dlg">
      <div class="dlg-head">
        <h2>討論草稿</h2>
        <span class="count" id="dfLens"></span>
        <button class="ghost small" id="dfRestart">重新開始</button>
        <label class="df-model" data-tip="對話問答用的模型；其他步驟先用 Claude，沒有時用本機">問答模型
          <select id="dfModel">
            <option value="auto">自動（Haiku）</option>
            <option value="haiku">Haiku</option>
            <option value="sonnet">Sonnet</option>
            <option value="opus">Opus</option>
            <option value="local">本機模型</option>
          </select>
        </label>
        <button class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
      </div>
      <div class="df-body">
        <ol class="df-steps" id="dfSteps"></ol>
        <section class="df-main" id="dfMain"></section>
        <aside class="df-side" id="dfSide"></aside>
      </div>
    </div>
  </dialog>

  <dialog class="dialog" id="dlgPaperRefs" aria-label="本篇文獻">
    <div class="dlg">
      <div class="dlg-head">
        <h2>本篇文獻</h2>
        <span class="count" id="paperRefsCount"></span>
        <button class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
      </div>
      <div class="paper-refs" id="paperRefs"></div>
    </div>
  </dialog>

  <!-- Settings pieces (setup.js): moved into the gear's tabs (LoreShell.settings:
       一般 workspace and author, 同步, 外觀 紙張) and the model window (模型 → 下載／登入…) -->
  <div id="setupParts" hidden>
        <section class="pc-part" id="partWorkspace">
          <div class="now" id="wzWsNow"></div>
          <div class="seg-row">
            <div class="seg wide" id="wzWsMode">
              <button data-v="new">建立新的</button>
              <button data-v="clone">從 repo 下載</button>
              <button data-v="open">開啟資料夾</button>
            </div>
            <button class="help" data-tip="論文、句型庫、出版社模板都存在工作區。填上你自己的 GitHub private repo 就能在多台電腦同步；留空則只存在這台電腦。">?</button>
          </div>
          <div class="form" data-mode="new">
            <label><span>private repo</span><input id="wzNewRemote" placeholder="留空＝只存在這台電腦"><span class="inline"><em class="vis" id="wzNewVis"></em><button class="ico" id="wzGhNew" data-icon="external" aria-label="到 GitHub 建立空白 private repo"></button></span></label>
            <label><span>位置</span><input id="wzNewPath"></label>
            <button class="primary small" id="wzNew">建立</button>
          </div>
          <div class="form" data-mode="clone" hidden>
            <label><span>private repo</span><input id="wzCloneUrl" placeholder="https://github.com/you/my-paper-workspace.git"><span class="inline"><em class="vis" id="wzCloneVis"></em></span></label>
            <label><span>位置</span><input id="wzCloneParent"></label>
            <button class="primary small" id="wzClone">下載</button>
          </div>
          <div class="form" data-mode="open" hidden>
            <label><span>資料夾</span><input id="wzOpenPath"></label>
            <label class="check"><input type="checkbox" id="wzOpenInit" checked><span>補上缺少的資料夾<button class="help" data-tip="只新增範本裡有、資料夾裡沒有的檔案，不覆蓋任何現有檔案。">?</button></span></label>
            <button class="primary small" id="wzOpen">開啟</button>
          </div>

        </section>
        <section class="pc-part" id="partGit">
          <div class="git-box" id="wzGitBox" hidden>
            <ul class="checks" id="wzGitNow"></ul>
            <div class="form" id="wzGitForm" hidden>
              <label><span>作者</span><input id="wzGitName" placeholder="名稱"></label>
              <label><span>email</span><input id="wzGitEmail" placeholder="可用 GitHub noreply 信箱"></label>
              <button class="primary small" id="wzGitSave">儲存</button>
            </div>
          </div>
        </section>
        <section class="pc-part" id="partLocal">
          <div class="now" id="wzSys"></div>
          <ul class="models" id="wzModels"></ul>
          <div id="wzPlan"></div>
        </section>
        <section class="pc-part" id="partClaude">
          <div class="seg-row">
            <div class="seg wide" id="wzVia">
              <button data-v="subscription">登入帳號（訂閱）</button>
              <button data-v="api">API key</button>
            </div>
            <button class="help" data-tip="登入帳號：用 claude.ai Pro／Max 帳號，透過 Claude Code 連線，算在訂閱額度內，只適合自己使用。API key：按用量另外計費，key 只存在這台電腦的系統金鑰圈。兩種都設定好的話，點一下就能切換。">?</button>
          </div>

          <div class="via" data-via="subscription">
            <ul class="checks" id="ccChecks"></ul>
            <div class="cmd" id="ccInstall" hidden><code id="ccCmd"></code><button class="ico" id="ccCopy" data-icon="copy" aria-label="複製指令"></button></div>
            <div class="actions-row">
              <button class="ghost" id="ccRecheck">重新檢查</button>
              <button class="primary small" id="ccLogin">用瀏覽器登入</button>
            </div>
          </div>

          <div class="via form" data-via="api" hidden>
            <!-- connected: masked key; editing: an empty field for a new one -->
            <div class="kv" id="wzKeyShow"><span>API key</span><code class="masked" id="wzKeyMasked"></code><span class="inline">
              <button class="ico" id="wzKeyEdit" data-icon="pen" aria-label="更換 key"></button>
              <button class="ico" id="wzClaudeRemove" data-icon="trash" aria-label="移除 key"></button>
            </span></div>
            <label id="wzKeyEnter"><span>API key</span><input type="password" id="wzClaudeKey" placeholder="sk-ant-…" autocomplete="off"><span class="inline">
              <button class="ico" id="wzClaudeGetKey" data-icon="external" aria-label="到 Anthropic Console 建立 key"></button>
              <button class="ico" id="wzKeyCancel" data-icon="x" aria-label="取消更換"></button>
            </span></label>
            <button class="primary small" id="wzClaudeSave">儲存 key</button>
          </div>

          <div class="form">
            <label><span>模型</span><select id="wzClaudeModel"></select></label>
          </div>
          <div class="actions-row test-row">
            <button class="ghost" id="wzTest">測試連線</button>
            <span class="note" id="wzTestOut"></span>
          </div>
        </section>
          <div class="look-row" id="partPaper"><span class="lbl">紙張</span>
            <div class="seg" id="lookPaper"><button data-v="white">白</button><button data-v="dim">調暗</button></div>
          </div>
  </div>

  <!-- 本機模型 / Claude: the connection's own steps (download, sign in, key), over the gear -->
  <dialog class="dialog" id="dlgModel" aria-label="模型">
    <div class="dlg">
      <div class="dlg-head">
        <h2 id="dlgModelTitle">模型</h2>
        <button class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
      </div>
      <div class="dlg-body" id="dlgModelBody"></div>
    </div>
  </dialog>

  <div class="menu" id="fileMenu" hidden role="menu"></div>
  <div class="pop export-pop" id="exportPop" hidden></div>
</div>
<script src="vendor/katex/katex.min.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
<script src="makedeck.js"></script>
<script src="tex.js"></script>
<script src="lazy.js"></script>
<script src="table.js"></script>
<script src="refs.js"></script>
<script src="export.js"></script>
<script src="write.js"></script>
<script src="wordcount.js"></script>
<script src="zoom.js"></script>
<script src="find.js"></script>
<script src="context.js"></script>
<script src="reader.js"></script>
<script src="kbcards.js"></script>
<script src="newpaper.js"></script>
<script src="draft.js"></script>
<script src="notation.js"></script>
<script src="templates.js"></script>
<script src="newtemplate.js"></script>
<script src="convert.js"></script>
<script src="open.js"></script>
<script src="home.js"></script>
<script src="editor.js"></script>
<script src="frame.js"></script>
<script src="app.js"></script>
<script src="review.js"></script>
<script src="setup.js"></script>
</body>
</html>
