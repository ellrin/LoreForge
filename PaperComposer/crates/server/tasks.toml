# ── 討論草稿 ───────────────────────────────────────────────
# The interview turns are short structured gradings under a detailed lens:
# a small model is enough (Haiku by default; Sonnet or a local model can be
# picked in the draft window). Organising steps use Sonnet; reading the
# experiment record into tables and the reviewer pass use Opus. Every step
# falls back to the local model when Claude is not available (src/draft/engine.rs
# fits prompts to its context, reads long material in pieces, repairs replies).

[task.pc-draft-record]
label = "整理實驗記錄"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "local:current"
max_tokens = 16000

[task.pc-draft-plan]
label = "規劃題組"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 8000

# 預想選項: 2–3 possible answers per item, from the record, before the interview
# (one batched call per plan / new group, in the background; never inside a turn)
[task.pc-draft-candidates]
label = "預想選項"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "local:current"
max_tokens = 16000

[task.pc-draft-turn]
label = "草稿問答"
class = "ask"
needs = { json = true }
default = "claude:haiku"
fallback = "local:current"

# 圖表規劃: the paper's figures and tables from the record and the journal's habit (one call,
# in parallel with 規劃題組)
[task.pc-draft-figures]
label = "圖表規劃"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 8000

# 深度討論: a conversation about one interview question (never material for the paper)
[task.pc-draft-discuss]
label = "深度討論"
class = "ask"
needs = { json = true }
default = "claude:sonnet"

[task.pc-draft-claims]
label = "主張登記"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 8000

[task.pc-draft-review]
label = "章節校正"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 8000

[task.pc-draft-outline]
label = "段落大綱"
