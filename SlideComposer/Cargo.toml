[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]
# Next: apps/desktop (Tauri shell), like PaperComposer / JELearner.

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ym-canvas = { path = "../commons/crates/ym-canvas" }
ym-ooxml = { path = "../commons/crates/ym-ooxml" }
ym-math = { path = "../commons/crates/ym-math" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tempfile = "3"
