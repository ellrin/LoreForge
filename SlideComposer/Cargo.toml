[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "apps/desktop"]
# `cargo build` / `cargo test` skip the desktop app so they need no WebView
# libraries; build it with `cargo run -p slidecomposer` or `cargo tauri build`.
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lore-canvas = { path = "../commons/crates/lore-canvas" }
lore-ooxml = { path = "../commons/crates/lore-ooxml" }
lore-math = { path = "../commons/crates/lore-math" }
lore-home = { path = "../commons/crates/lore-home" }
lore-fonts = { path = "../commons/crates/lore-fonts" }
lore-notation = { path = "../commons/crates/lore-notation" }
lore-shell = { path = "../commons/crates/lore-shell" }
lore-plot = { path = "../commons/crates/lore-plot" }
lore-engines = { path = "../commons/crates/lore-engines" }
lore-llm = { path = "../commons/crates/lore-llm" }
lore-docsrc = { path = "../commons/crates/lore-docsrc" }
lore-words = { path = "../commons/crates/lore-words" }
kb-core = { path = "../commons/crates/kb-core" }
lore-store = { path = "../commons/crates/lore-store" }
lore-jobs = { path = "../commons/crates/lore-jobs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
tempfile = "3"
