[package]
name = "sc-server"
version.workspace = true
edition.workspace = true

# Local server on 127.0.0.1:7880: serves web/ and the JSON API. Handlers are plain
# async fns over `Shared` so they can become Tauri commands later.

[dependencies]
sc-core = { path = "../core" }
lore-canvas.workspace = true
lore-ooxml.workspace = true
lore-math.workspace = true
lore-home.workspace = true
lore-fonts.workspace = true
lore-notation.workspace = true
lore-shell.workspace = true
lore-engines.workspace = true
lore-llm.workspace = true
lore-docsrc.workspace = true
lore-words.workspace = true
kb-core.workspace = true
lore-store.workspace = true
lore-jobs.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
