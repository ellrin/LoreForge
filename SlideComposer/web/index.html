<!doctype html>
<html lang="zh-Hant" data-theme="giftbox" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlideComposer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='5' width='20' height='14' rx='2' fill='%23ff6b35'/%3E%3Crect x='5' y='8' width='8' height='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="prefs.css">
  <script src="theme.js"></script>
</head>
<body class="at-home">
<div class="app" id="app">
  <header class="top" data-tauri-drag-region>
    <button class="ico narrow-only ed-only" id="toggleSorter" data-icon="cards" aria-label="投影片" aria-pressed="false"></button>
    <button class="brand" id="actHome" aria-label="首頁">SLIDE<b>/</b>COMPOSER</button>
    <button class="picker ed-only" id="deckPicker" aria-haspopup="menu"><span data-icon="cards"></span><span id="deckName"></span><span data-icon="chevron"></span></button>
    <button class="fstate ed-only" id="fileState" hidden></button>
    <button class="chip ed-only" id="fontChip" hidden aria-haspopup="true" aria-expanded="false"></button>
    <div class="fontpop" id="fontPop" role="dialog" aria-label="字型代替" hidden></div>
    <div class="top-right">
      <span class="ed-only top-group">
        <button class="ico" id="actUndo" data-icon="undo" aria-label="復原 ⌘Z" disabled></button>
        <button class="ico" id="actRedo" data-icon="redo" aria-label="重做 ⇧⌘Z" disabled></button>
        <span class="vsep"></span>
        <button class="ico" id="actNotation" data-icon="book" aria-label="方程式與變數"></button>
        <button class="ico" id="actShow" data-icon="play" aria-label="放映" aria-haspopup="menu"></button>
        <button class="ico" id="actExport" data-icon="download" aria-label="匯出" aria-haspopup="menu"></button>
        <button class="ico narrow-only" id="toggleSide" data-icon="panel" aria-label="面板" aria-pressed="false"></button>
        <span class="vsep"></span>
      </span>
      <button class="ico" id="actSettings" data-icon="gear" aria-label="設定"></button>
      <button class="ico" id="actLook" data-icon="sun" aria-label="外觀"></button>
    </div>
  </header>

  <aside class="left sorter" id="sorter" aria-label="投影片">
    <div class="nav-head">
      <h2 class="panel-title" id="slideCount"></h2>
      <button class="ico small" id="slideAdd" data-icon="plus" aria-label="新增投影片"></button>
      <button class="ico small" id="slideDup" data-icon="dup" aria-label="複製投影片"></button>
      <button class="ico small" id="slideHide" data-icon="eyeOff" aria-label="隱藏／顯示"></button>
      <button class="ico small" id="slideDel" data-icon="trash" aria-label="刪除投影片"></button>
    </div>
    <div id="thumbs"></div>
  </aside>

  <main class="stage page-area">
    <nav class="writebar" id="tools" aria-label="工具">
      <button class="ico" data-tool="select" data-icon="cursor" aria-label="選取 V" aria-pressed="true"></button>
      <button class="ico" data-tool="text" data-icon="text" aria-label="文字方塊 T"></button>
      <span class="vsep"></span>
      <button class="ico" data-tool="rect" data-icon="square" aria-label="矩形"></button>
      <button class="ico" data-tool="roundRect" data-icon="rounded" aria-label="圓角矩形"></button>
      <button class="ico" data-tool="ellipse" data-icon="circle" aria-label="橢圓"></button>
      <button class="ico" data-tool="triangle" data-icon="triangle" aria-label="三角形"></button>
      <button class="ico" data-tool="trapezoid" data-icon="trapezoid" aria-label="梯形"></button>
      <button class="ico" data-tool="polygon" data-icon="polygon" aria-label="多邊形"></button>
      <span class="vsep"></span>
      <button class="ico" data-tool="line" data-icon="line" aria-label="直線"></button>
      <button class="ico" data-tool="arrow" data-icon="arrow" aria-label="箭頭"></button>
      <button class="ico" data-tool="conn-straight" data-icon="conn" aria-label="連接線"></button>
      <button class="ico" data-tool="conn-elbow" data-icon="elbow" aria-label="肘形連接線"></button>
      <button class="ico" data-tool="conn-curved" data-icon="curve" aria-label="曲線連接線"></button>
      <span class="vsep"></span>
      <button class="ico" id="insImage" data-icon="image" aria-label="圖片"></button>
      <button class="ico" id="insTable" data-icon="table" aria-label="表格"></button>
      <button class="ico" id="insEq" data-icon="sigma" aria-label="方程式"></button>
      <button class="ico" id="insComp" data-icon="puzzle" aria-label="元件"></button>
      <span class="vsep"></span>
      <button class="ico" id="actGrid" data-icon="grid" aria-label="格線"></button>
      <button class="ico" id="actSnap" data-icon="magnet" aria-label="吸附 ⌥" aria-pressed="true"></button>
      <button class="ico" id="actReveal" data-icon="steps" aria-label="漸進揭露"></button>
      <input type="file" id="imgFile" accept="image/*" hidden>
    </nav>
    <div class="viewport" id="viewport">
      <div class="paper-wrap" id="paperWrap">
        <div class="paper editor-canvas" id="paper"></div>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
    <details class="notes" id="notesBox"><summary>講者備註</summary><textarea id="notes" aria-label="講者備註"></textarea></details>
    <footer class="statusbar">
      <span class="accent" id="stPos"></span>
      <span id="stLayout"></span>
      <span id="saveChip"><i class="dot"></i>已儲存</span>
      <span class="grow"></span>
      <button class="ico tiny" id="actZoomOut" data-icon="zoomOut" aria-label="縮小"></button>
      <button class="zoom" id="zoomChip" aria-label="符合視窗">100%</button>
      <button class="ico tiny" id="actZoomIn" data-icon="zoomIn" aria-label="放大"></button>
      <button class="ico tiny" id="actFit" data-icon="fit" aria-label="符合視窗"></button>
    </footer>
  </main>

  <aside class="right side" id="side">
    <div id="blocks"></div>
  </aside>
</div>

<section class="home" id="home" hidden>
  <div class="home-inner">
    <section class="block" data-open="true">
      <div class="block-head"><span class="n">01</span><h3>開始</h3></div>
      <div class="block-body tiles">
        <label class="tile drop" id="tileImport"><span data-icon="pen"></span>開啟…<input type="file" id="impFile" accept=".pptx" hidden></label>
        <button class="tile" id="tileNew"><span data-icon="plus"></span>新簡報</button>
      </div>
    </section>
    <section class="block" data-open="true" id="recentBlock" hidden>
      <div class="block-head"><span class="n">02</span><h3>最近</h3></div>
      <div class="block-body recent" id="deckList"></div>
    </section>
  </div>
</section>

<dialog class="dialog small" id="dlgNew" aria-label="新簡報">
  <form class="dlg" id="newForm" method="dialog">
    <div class="dlg-head">
      <h2>新簡報</h2>
      <button type="button" class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
    </div>
    <div class="np-body">
      <div class="bases" id="baseList" role="radiogroup" aria-label="底版"></div>
      <label class="np-label" for="newName">名稱</label>
      <input class="np-input" id="newName" autocomplete="off">
    </div>
    <div class="np-foot"><span class="grow"></span><button class="primary small" id="newBtn">建立<kbd>↵</kbd></button></div>
  </form>
</dialog>

<dialog class="dialog small" id="dlgSet" aria-label="設定">
  <div class="dlg">
    <div class="dlg-head">
      <h2>設定</h2>
      <button type="button" class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
    </div>
    <div class="np-body">
      <div class="np-label">外觀</div>
      <div id="themePick"></div>
      <div class="np-label">路徑</div>
      <dl class="env" id="envInfo"></dl>
    </div>
  </div>
</dialog>

<dialog class="dialog big" id="dlgNotation" aria-label="方程式與變數">
  <div class="dlg">
    <div class="dlg-head">
      <h2>方程式與變數</h2>
      <span class="chip" id="ntState" hidden></span>
      <button type="button" class="ghost" id="ntExtract"><span data-icon="spark"></span>擷取</button>
      <button type="button" class="ico close" data-icon="x" aria-label="關閉 Esc"></button>
    </div>
    <notation-panel id="ntPanel" mode="literal"></notation-panel>
  </div>
</dialog>

<dialog id="dlg"></dialog>

<script src="vendor/katex/katex.min.js"></script>
<script src="icons.js"></script>
<script src="prefs.js"></script>
<script src="render.js"></script>
<script src="arrange.js"></script>
<script src="panels.js"></script>
<script src="notation-panel.js"></script>
<script src="present.js"></script>
<script src="app.js"></script>
</body>
</html>
