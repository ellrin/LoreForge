<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0B33"/>
      <stop offset="0.6" stop-color="#0C0619"/>
      <stop offset="1" stop-color="#05030C"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="34" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="screen" d="M 232 236 H 792 Q 820 236 820 264 V 612 Q 820 640 792 640 H 232 Q 204 640 204 612 V 264 Q 204 236 232 236 Z"/>
    <path id="stand" d="M 512 640 V 760 M 400 800 L 512 760 L 624 800"/>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#haze)"/>

    <!-- perspective grid floor -->
    <g stroke="#FF2BD6" stroke-opacity="0.35" stroke-width="4" fill="none">
      <line x1="0" y1="760" x2="1024" y2="760"/>
      <line x1="0" y1="812" x2="1024" y2="812"/>
      <line x1="0" y1="876" x2="1024" y2="876"/>
      <line x1="0" y1="956" x2="1024" y2="956"/>
      <line x1="512" y1="700" x2="512" y2="1024"/>
      <line x1="512" y1="700" x2="292" y2="1024"/>
      <line x1="512" y1="700" x2="732" y2="1024"/>
      <line x1="512" y1="700" x2="72" y2="1024"/>
      <line x1="512" y1="700" x2="952" y2="1024"/>
      <line x1="512" y1="700" x2="-148" y2="1024"/>
      <line x1="512" y1="700" x2="1172" y2="1024"/>
    </g>

    <!-- scanlines -->
    <g fill="#FFFFFF" fill-opacity="0.035">
      <rect x="0" y="120" width="1024" height="6"/>
      <rect x="0" y="240" width="1024" height="6"/>
      <rect x="0" y="360" width="1024" height="6"/>
      <rect x="0" y="480" width="1024" height="6"/>
      <rect x="0" y="600" width="1024" height="6"/>
    </g>
  </g>

  <!-- dark screen body so the neon reads on top of the grid -->
  <use href="#screen" fill="#0A0616" fill-opacity="0.92"/>

  <!-- chromatic-aberration ghosts -->
  <g fill="none" stroke-width="30" stroke-linejoin="round" stroke-linecap="round" opacity="0.85">
    <use href="#screen" transform="translate(-12 0)" stroke="#FF2BD6"/>
    <use href="#screen" transform="translate(12 0)" stroke="#00F0FF"/>
    <use href="#stand" transform="translate(-12 0)" stroke="#FF2BD6"/>
    <use href="#stand" transform="translate(12 0)" stroke="#00F0FF"/>
  </g>

  <!-- main neon outline -->
  <g fill="none" stroke="#B8FBFF" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <use href="#screen"/>
    <use href="#stand"/>
  </g>

  <!-- title -->
  <line x1="276" y1="326" x2="560" y2="326" stroke="#00F0FF" stroke-width="40" stroke-linecap="round" filter="url(#glow)"/>

  <!-- bar chart -->
  <g filter="url(#glow)">
    <rect x="300" y="476" width="64" height="104" rx="10" fill="#00F0FF" fill-opacity="0.75"/>
    <rect x="410" y="420" width="64" height="160" rx="10" fill="#00F0FF" fill-opacity="0.9"/>
    <rect x="520" y="390" width="64" height="190" rx="10" fill="#FF2BD6"/>
    <rect x="630" y="440" width="64" height="140" rx="10" fill="#00F0FF" fill-opacity="0.8"/>
  </g>

  <!-- glitch slice -->
  <rect x="590" y="452" width="128" height="14" fill="#FF2BD6" opacity="0.9"/>
  <rect x="650" y="482" width="70" height="8" fill="#00F0FF" opacity="0.9"/>

  <!-- pointer dot -->
  <circle cx="742" cy="330" r="24" fill="#FCEE0A" filter="url(#glow)"/>
</svg>
