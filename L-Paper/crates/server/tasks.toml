default = "local:current"
fallback = "claude:selected"
offline = true

[task.pc-ref-queries]
label = "文獻搜尋關鍵字"
class = "tidy"
needs = { json = true }
default = "claude:selected"
fallback = "local:current"
offline = false

[task.pc-ref-rank]
label = "文獻排序"
class = "tidy"
needs = { json = true }
default = "claude:selected"
fallback = "local:current"
offline = false

[task.pc-ref-notes]
label = "文獻摘要與標籤"
class = "tidy"
