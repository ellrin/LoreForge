# ── 討論草稿 ───────────────────────────────────────────────
# The interview turns are short structured gradings under a detailed lens:
# a small model is enough (Haiku by default; Sonnet or a local model can be
# picked in the draft window). Organising steps use Sonnet; reading the
# experiment record into tables and the reviewer pass use Opus. Every step
# falls back to the local model when Claude is not available (src/draft/engine.rs
# fits prompts to its context, reads long material in pieces, repairs replies).

[task.pc-draft-record]
purpose = "plan"
agy = true
label = "整理實驗記錄"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "local:current"
max_tokens = 16000

[task.pc-draft-plan]
purpose = "plan"
agy = true
label = "規劃題組"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 8000

# 預想選項: 2–3 possible answers per item, from the record, before the interview
# (one batched call per plan / new group, in the background; never inside a turn)
[task.pc-draft-candidates]
purpose = "plan"
agy = true
label = "預想選項"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "local:current"
max_tokens = 16000

[task.pc-draft-turn]
agy = true
label = "草稿問答"
class = "ask"
needs = { json = true }
default = "claude:haiku"
fallback = "local:current"

# 圖表規劃: the paper's figures and tables from the record and the journal's habit (one call,
# in parallel with 規劃題組)
[task.pc-draft-figures]
purpose = "plan"
agy = true
label = "圖表規劃"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "claude:sonnet"
max_tokens = 8000

# 深度討論: a conversation about one interview question (never material for the paper).
# Cloud only, so no class: a class lets the shared routing add the local model, and `ask`
# puts it first (a 20k-character record on the local model took over 70 s per reply).
[task.pc-draft-discuss]
purpose = "chat"
agy = true
label = "深度討論"
needs = { json = true }
default = "claude:sonnet"

# 骨架 (docs/long-paper.md §G). The planner lays out the whole paper at once: Claude only, so no
# class (a class lets the shared routing add the local model); an Opus refusal falls to Sonnet
# (src/draft/engine.rs `Attempts::failed`).
[task.pc-draft-skeleton]
purpose = "plan"
agy = true
label = "排骨架"
needs = { json = true }
default = "claude:opus"
# the reply is the whole paper's skeleton and its questions: a long paper passes 16000
max_tokens = 32000

# 暫存: the touched paragraphs and their neighbours (Claude first, `create`).
[task.pc-draft-skeleton-repair]
agy = true
label = "骨架修補"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 8000

# 補肉: one answer → the paragraph's points, in the background. `create` keeps Claude first
# (`ask` would put the local model first).
[task.pc-draft-fill]
agy = true
label = "要點回填"
class = "create"
needs = { json = true }
default = "claude:haiku"
fallback = "local:current"

[task.pc-draft-claims]
agy = true
label = "主張登記"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 8000

[task.pc-draft-review]
agy = true
label = "章節校正"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 8000

[task.pc-draft-outline]
agy = true
label = "段落大綱"
class = "create"
needs = { json = true }
default = "claude:sonnet"
fallback = "local:current"
max_tokens = 16000

[task.pc-draft-audit]
purpose = "plan"
agy = true
label = "審稿檢查"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "local:current"
max_tokens = 16000

[task.pc-draft-revise]
purpose = "plan"
agy = true
label = "修訂方案"
class = "create"
needs = { json = true }
default = "claude:opus"
fallback = "local:current"
max_tokens = 16000

[task.pc-template-rules]
label = "讀取投稿規則"
class = "tidy"
needs = { json = true }
default = "claude:selected"
fallback = "local:current"
