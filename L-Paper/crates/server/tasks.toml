# L-Paper's LLM tasks (design §9), layered over lore-llm's shared
# tasks.toml. A user file `<config folder>/PaperComposer/tasks.toml` in the
# same format can add an `[override]` per task.
#
# Two lore-llm model refs here mean "what the user set up in the app":
#   local:current     the local engine that is connected (an external
#                     llama-server from [engine] url, or the model started in
#                     「AI 與同步」)
#   claude:selected   the Claude model picked in settings; subscription first,
#                     then the API key
#
# The engine switch in the UI (本機 / 訂閱 / API) becomes a strict override for
# the call (that engine or an error, no fallback): local:current,
# claude-code:selected or claude-api:selected. With no choice ("auto") the
# order below applies: local first, then Claude.
#
# Template conversion is not a task here: it runs the Claude Code agent itself.

# `agy = true`: a writing task the author may give to an Antigravity model (text and JSON only)
# in 設定 → 模型 → 各步驟; the tasks that look at pictures or search the web do not have it.

[task.pc-compose-paragraph]
agy = true
label = "撰寫段落"
class = "create"
needs = { json = true }
default = "local:current"
fallback = "claude:selected"
offline = true

[task.pc-soft-check]
agy = true
label = "軟規則檢查"
class = "create"
needs = { json = true }
default = "local:current"
fallback = "claude:selected"
offline = true

[task.pc-decompose]
agy = true
label = "拆解句型"
class = "tidy"
needs = { json = true }
default = "local:current"
fallback = "claude:selected"
offline = true

[task.pc-outline]
purpose = "plan"
agy = true
label = "大綱與標題"
class = "create"
needs = { json = true }
default = "claude:selected"
fallback = "local:current"
offline = false

[task.pc-thesis-check]
agy = true
label = "Key value 檢查"
class = "tidy"
needs = { json = true }
default = "local:current"
fallback = "claude:selected"
offline = true

[task.pc-caption]
agy = true
label = "圖表標題"
