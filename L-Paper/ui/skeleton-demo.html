<!doctype html>
<!-- 骨架 on the synthetic fixture, with a pretend server in the page (no model, no network).
     From the repo root: python3 -m http.server 8765 → /L-Paper/ui/skeleton-demo.html
     ?theme=<id>&mode=dark|light   the shared theme
     ?empty=1                      before a skeleton exists (素材 first)
     ?tab=inventory|style          start on that tab
     ?do=answer,write,fold,note,narrow   a scripted state, for screenshots
     ?at=<id>                      scroll to that frame or paragraph
     On the app's own server (isolated_server --mock …): /skeleton-demo.html?paper=<name> talks to the real
     routes instead of the pretend server. ?step=plan|answer|write|refine|accept|save|style|place does that one
     thing through the page and waits for it; the page title says how it went (run them in this order,
     the server keeps the state between runs). -->
<html lang="zh-Hant" data-theme="giftbox" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骨架 demo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <script>
    // from the repo root the shared files are in commons/ui; from the app's own server they are at the root
    const SHARED = location.pathname.includes("/L-Paper/ui/") ? "../../commons/ui/" : "";
    document.write(`<link rel="stylesheet" href="${SHARED}theme.css"><link rel="stylesheet" href="${SHARED}base.css">`);
  </script>
  <link rel="stylesheet" href="skeleton.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; }
    #stage { flex: 1; min-width: 0; margin: 20px auto; max-width: 1240px; height: calc(100vh - 40px); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    #stage > .dlg-head { border-bottom: 1px solid var(--line); }
    #root { flex: 1; min-height: 0; }
  </style>
</head>
<body>
<div id="stage">
  <div class="dlg-head"><h2>骨架</h2></div>
  <div id="root"></div>
</div>
<script>document.write(`<script src="${SHARED}icons.js"><\/script>`);</script>
<script src="skeleton.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get("theme")) document.documentElement.dataset.theme = Q.get("theme");
if (Q.get("mode")) document.documentElement.dataset.mode = Q.get("mode");
if (Q.get("do")?.includes("narrow")) document.querySelector("#stage").style.maxWidth = "760px";
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const SPEED = Q.get("fast") ? 0.05 : 1;

// ── a pretend server: the same routes, on a copy of the fixture ──
let V, full, undo = [], ids = 100;
const bump = () => { V.rev++; return structuredClone(V); };
const all = () => V.sections.flatMap((s) => s.blocks.flatMap((b) => b.paras));
const where = (id) => { for (const s of V.sections) { if (s.id === id) return { s }; for (const [bi, b] of s.blocks.entries()) { if (b.id === id) return { s, b, at: bi }; for (const [pi, p] of b.paras.entries()) if (p.id === id) return { s, b, p, at: pi }; } } };
const para = (say = "") => ({ id: `p${++ids}`, kind: "", say, points: [], link_prev: "", link_next: "", jump: null, floats: [], cites: [], sources: [], pending: [], text: "", state: "outline", busy: null, problems: [], reason: "", touched: true });
const TEXT = "In the external dataset, the ranking changed. Method C reached the highest accuracy, while Method A fell to second. We report this reversal as observed and limit the main claim to the internal data.";
function apply(o) {
  if (o.op === "undo") { const last = undo.pop(); if (last) { V.sections = last; } V.can_undo = undo.length > 0; return; }
  undo.push(structuredClone(V.sections));
  const f = o.id && where(o.id);
  if (o.op === "add_para") where(o.block).b.paras.splice(o.at, 0, para(o.say));
  else if (o.op === "add_block") where(o.section).s.blocks.splice(o.at, 0, { id: `b${++ids}`, title: o.title, purpose: "", of: o.of, paras: [] });
  else if (o.op === "remove") { if (f.p) f.b.paras.splice(f.at, 1); else f.s.blocks.splice(f.at, 1); }
  else if (o.op === "move") { const t = where(o.to); if (f.p) { f.b.paras.splice(f.at, 1); t.b.paras.splice(o.at, 0, f.p); f.p.touched = true; if (o.reason) f.p.reason = o.reason; } else { f.s.blocks.splice(f.at, 1); t.s.blocks.splice(o.at, 0, f.b); } }
  else if (o.op === "edit") { Object.assign(f.p ?? f.b, o.fields); if (f.p) f.p.touched = true; }
  else if (o.op === "reason") f.p.reason = o.reason;
  else if (o.op === "done") f.p.state = o.done ? "done" : "text";
  V.dirty = true; V.can_undo = true;
}
async function call(path, body) {
  await wait(40 * SPEED);
  if (path === "") return structuredClone(V);
  if (path === "/ops") { body.ops.forEach(apply); return bump(); }
  if (path === "/inventory") {
    V.inventory.forEach((x) => (x.keep = body.keep.includes(x.id)));
    for (const a of body.add) V.inventory.push({ id: `v${++ids}`, kind: a.kind, title: a.title, note: a.note, evidence: [], label: "", keep: true, by_author: true, pending: false, tool: "" });
    return bump();
  }
  if (path === "/plan" || path === "/convert") {
    V.job = { kind: "plan", label: "排骨架", done: 0, total: 5, error: "" };
    (async () => { for (let i = 1; i <= 5; i++) { await wait(700 * SPEED); V.job.done = i; V.rev++; } V = { ...structuredClone(full), inventory: V.inventory, rev: V.rev + 1, dirty: false }; })();
    return bump();
  }
  if (path === "/answer" || path === "/note") {
    let t;
    if (path === "/note") { t = { id: `n${++ids}`, anchor: body.anchor, kind: "note", status: "answered", question: "", options: [], messages: [{ who: "me", text: body.text }], conclusion: "", changes: [] }; V.threads.push(t); }
    else { t = V.threads.find((x) => x.id === body.thread); const said = body.text || t.options.filter((o) => body.picked.includes(o.id)).map((o) => o.text).join("；"); if (body.skip) { t.status = "skipped"; } else { t.status = "answered"; if (t.messages.at(-1)?.who !== "me") t.messages.push({ who: "me", text: said }); } }
    V.next = V.threads.find((x) => x.status === "open" && ["conflict", "choice", "missing"].includes(x.kind))?.id ?? null;
    const p = where(t.anchor)?.p;
    if (!body.skip) {
      if (p) p.busy = "fill";
      (async () => {
        await wait(1500 * SPEED);
        const said = t.messages.at(-1).text;
        if (p) { p.points.push({ text: said.length > 26 ? `${said.slice(0, 26)}…` : said, from: t.id }); p.busy = null; if (p.state === "outline") p.state = "points"; }
        t.status = "done"; t.conclusion = said; V.rev++;
      })();
    }
    return bump();
  }
  if (path === "/write") {
    const f = where(body.id);
    const list = body.id === "all" ? all() : f.p ? [f.p] : f.b ? f.b.paras : f.s.blocks.flatMap((b) => b.paras);
    list.forEach((p) => (p.busy = "write"));
    (async () => { for (const p of list) { await wait(900 * SPEED); p.text = p.text || TEXT; p.state = p.state === "done" ? "done" : "text"; p.busy = null; V.rev++; } })();
    return bump();
  }
  if (path === "/refine") {
    const p = where(body.para).p;
    const first = p.text.split(". ")[0];
    V.threads.push({ id: `r${++ids}`, anchor: p.id, kind: "refine", status: "open", question: "", options: [], messages: [], conclusion: "", changes: [{ id: "c1", target: p.id, field: "text", before: first, after: first.replace("reached", "achieved"), why: body.preset === "wording" ? "用字" : body.preset === "style" ? "我的風格：句首換成對比" : "句長超過上限", state: "proposed" }] });
    return bump();
  }
  if (path === "/change") {
    const t = V.threads.find((x) => x.id === body.thread);
    const c = t.changes.find((x) => x.id === body.change);
    const p = where(c.target)?.p;
    if (t.kind === "edit") { c.state = body.accept ? "applied" : "reverted"; if (p) p[c.field] = body.accept ? c.after : c.before; }
    else { c.state = body.accept ? "applied" : "rejected"; if (body.accept && p) p.text = p.text.replace(c.before, c.after); if (t.changes.every((x) => x.state !== "proposed")) { t.status = "done"; t.conclusion = "細修處理完"; } }
    return bump();
  }
  if (path === "/save") {
    V.job = { kind: "save", label: "暫存", done: 0, total: 1, error: "" };
    (async () => {
      await wait(1200 * SPEED);
      for (const p of all().filter((x) => x.touched)) {
        const ch = [];
        if (!p.say) { ch.push({ id: "c1", target: p.id, field: "say", before: "", after: "交代這一類個案為什麼造成排名改變", why: p.reason || "新增的段落", state: "applied" }); p.say = ch[0].after; }
        if (!p.link_prev) { ch.push({ id: "c2", target: p.id, field: "link_prev", before: "", after: "承接上一段的結論", why: "補上銜接", state: "applied" }); p.link_prev = "承接上一段的結論"; }
        if (ch.length) V.threads.push({ id: `e${++ids}`, anchor: p.id, kind: "edit", status: "done", question: "", options: [], messages: [], conclusion: "補上說明與銜接", changes: ch });
        p.touched = false; p.reason = ""; p.jump = null;
      }
      V.dirty = false; V.job = null; V.rev++;
    })();
    return bump();
  }
  if (path === "/place") return bump();
  if (path === "/style") return { sections: V.sections.filter((s) => s.blocks.some((b) => b.paras.some((p) => p.text))).map((s) => ({ id: s.id, title: s.title, rows: [
    { id: "para_words", label: "每段字數", mine: [80, 150], draft: 46.0, ok: false },
    { id: "sentences", label: "每段句數", mine: [4, 6], draft: 3.0, ok: false },
    { id: "sentence_words", label: "每句字數", mine: [21, 21], draft: 15.3, ok: false },
    { id: "sentence_iqr", label: "句長離散（四分位距）", mine: null, draft: 7.4, ok: null },
    { id: "rhythm", label: "相鄰句長變化率", mine: null, draft: 0.42, ok: null },
    { id: "conclusion_share", label: "結論句比例", mine: [0.13, 0.17], draft: 0.33, ok: false },
    { id: "connectives", label: "每段連接詞開頭的句數", mine: null, draft: 1.0, ok: null },
    { id: "banned", label: "禁用字", mine: [0, 0], draft: 0.0, ok: true },
  ], paras: s.blocks.flatMap((b) => b.paras).filter((p) => p.text).slice(0, 2).map((p) => ({ id: p.id, issues: ["段落太短", "沒有理由句"] })) })) };
  throw new Error(`demo: ${path}`);
}

// ── the real server (?paper=…) ──
async function real() {
  const base = `/api/papers/${encodeURIComponent(Q.get("paper"))}/draft/skeleton`;
  const call = async (path, body) => {
    const r = await fetch(base + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const text = await r.text();
    if (!r.ok) throw new Error(text || String(r.status));
    return text ? JSON.parse(text) : null;
  };
  await PCSkeleton.mount(document.querySelector("#root"), { call });
  const S = () => PCSkeleton.state();
  const view = () => S().view;
  const paras = () => view().sections.flatMap((s) => s.blocks.flatMap((b) => b.paras));
  const until = async (cond, ms = 30000) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { if (cond()) return true; await wait(200); } return false; };
  const idle = () => until(() => (!view().job || view().job.error) && !paras().some((p) => p.busy) && !view().threads.some((t) => t.status === "answered") && !S().inflight);
  const click = (sel) => { const n = document.querySelector(sel); if (!n) throw new Error(`沒有 ${sel}`); n.click(); };
  const step = Q.get("step");
  let note = "";
  try {
    if (step === "plan") { click(".sk-invfoot .btn.primary, .sk-invfoot .btn"); await until(() => view().exists && !view().job); note = `${paras().length} 段 ${view().threads.length} 題 next=${view().next}`; }
    else if (step === "answer") {
      const before = view().threads.filter((t) => t.status === "done").length;
      const q = document.querySelector(".sk-thread.sk-active");
      const qid = q.dataset.thread;
      q.querySelector(".sk-opt").click();
      await wait(150);
      const next = document.querySelector(".sk-thread.sk-active")?.dataset.thread;
      await idle();
      note = `答 ${qid} 下一題 ${next ?? "無"} 完成 ${before}→${view().threads.filter((t) => t.status === "done").length} 新要點 ${document.querySelectorAll(`.sk-points li[data-from="${qid}"]`).length}`;
    } else if (step === "write") { await call("/write", { id: "all" }).then(() => PCSkeleton.mount(document.querySelector("#root"), { call })); await idle(); note = `有文字 ${paras().filter((p) => p.text).length}/${paras().length} 問題 ${paras().reduce((n, p) => n + p.problems.length, 0)}`; }
    else if (step === "refine") { const p = paras().find((x) => x.text); await call("/refine", { para: p.id, preset: "wording" }); await PCSkeleton.mount(document.querySelector("#root"), { call }); await idle(); note = `細修串 ${view().threads.filter((t) => t.kind === "refine").length} 建議 ${document.querySelectorAll(".sk-change").length}`; }
    else if (step === "accept") { click('.sk-thread[data-kind="refine"] .sk-change .btn'); await wait(300); await idle(); note = `已採用 ${view().threads.flatMap((t) => t.changes).filter((c) => c.state === "applied").length}`; }
    else if (step === "save") {
      const b = view().sections[0].blocks[0];
      document.querySelector(`[data-id="${b.id}"] .sk-gap`).click();
      await wait(100);
      const ed = document.querySelector(`[data-id="${b.id}"] textarea.sk-say`);
      ed.value = "新增的一段"; ed.dispatchEvent(new Event("input"));
      await wait(600);
      document.querySelector(`[data-id="${b.id}"] textarea.sk-say`).dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      await wait(600);
      click(".sk-save");
      await wait(300);
      await idle();
      note = `dirty=${view().dirty} 修補串 ${view().threads.filter((t) => t.kind === "edit").length} 段 ${paras().length}`;
    } else if (step === "style") { click(".sk-head .seg button:nth-child(3)"); await until(() => !!document.querySelector(".sk-srow, .sk-style h3"), 8000); note = `列 ${document.querySelectorAll(".sk-srow").length} 段落提醒 ${document.querySelectorAll(".sk-sissue").length}`; }
    else if (step === "place") { const r = await call("/place", {}); note = `放進論文 rev=${r.rev}`; }
    document.title = `step ${step ?? "view"}: ok ${note}`;
  } catch (e) { document.title = `step ${step}: FAILED ${e.message}`; }
  if (Q.get("at")) { await wait(60); const sc = document.querySelector(".sk-scroll"); const n = document.querySelector(`[data-id="${Q.get("at")}"]`); if (sc && n) sc.scrollTop += n.getBoundingClientRect().top - sc.getBoundingClientRect().top - 12; }
  if (Q.get("tab") && view().exists) { S().tab = Q.get("tab"); PCSkeleton.redraw(); }
}

(async () => {
  if (Q.get("paper")) return real();
  full = await (await fetch("../crates/core/tests/fixtures/skeleton_view.json")).json();
  V = structuredClone(full);
  if (Q.get("empty")) { V.exists = false; V.sections = []; V.threads = []; V.next = null; V.dirty = false; V.can_undo = false; }
  // the answer the fixture shows as being folded in finishes after a moment
  setTimeout(() => { const t = V.threads.find((x) => x.status === "answered"); if (!t) return; const p = where(t.anchor)?.p; if (p) { p.busy = null; p.points.push({ text: "如實寫反轉，主張限定在內部資料", from: t.id }); } t.status = "done"; t.conclusion = "如實寫反轉，主張限定在內部資料"; V.rev++; }, 2500 * SPEED);
  await PCSkeleton.mount(document.querySelector("#root"), { call });
  let S = PCSkeleton.state();
  if (Q.get("tab")) { S.tab = Q.get("tab"); }
  const steps = (Q.get("do") ?? "").split(",");
  if (steps.includes("fold")) S.folded.add("b3");
  if (steps.includes("note")) S.noteAt = "p12";
  if (steps.includes("nohints")) S.hints = false;
  PCSkeleton.redraw();
  if (steps.includes("answer")) document.querySelector(".sk-thread.sk-active .sk-opt")?.click();
  if (steps.includes("write")) document.querySelector('[data-id="b4"] .sk-bhead [aria-label="寫這個框還沒寫的段落"]')?.click();
  if (steps.includes("refine")) { await call("/refine", { para: "p6", preset: "wording" }); await PCSkeleton.mount(document.querySelector("#root"), { call }); }
  // ?probe=typing: type into the open answer while the pretend server keeps changing; the box must
  // stay the same node (an IME composition would be cut otherwise). The result is the page title.
  if (Q.get("probe") === "typing") {
    const box = () => document.querySelector(".sk-thread.sk-active .sk-answer");
    const first = box();
    first.focus();
    let same = true;
    for (let i = 0; i < 8; i++) {
      first.value += "字"; first.dispatchEvent(new Event("input"));
      const p = where("p8").p; p.points.push({ text: `背景更新 ${i}`, from: null }); V.rev++;
      PCSkeleton.state().view.threads.find((t) => t.status === "answered") || (V.threads[1].status = "answered");
      await wait(900);
      same = same && box() === first && document.activeElement === first;
    }
    document.title = `probe typing: ${same ? "ok" : "FAILED"} value=${first.value.length} points=${document.querySelectorAll('[data-id="p8"] .sk-points li').length}`;
  }
  // ?probe=ops: add, name, move by keyboard, drag, remove, undo, 暫存 — each checked on the pretend
  // server's own data (what the page sent), not on the page. The result is the page title.
  if (Q.get("probe") === "ops") {
    const out = [];
    const ok = (name, cond) => out.push(`${cond ? "ok" : "FAILED"} ${name}`);
    const ids = (b) => where(b).b.paras.map((p) => p.id).join(",");
    const node = (id) => document.querySelector(`.sk-canvas [data-id="${id}"]`);
    const key = (el, k, more = {}) => el.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, ...more }));
    const settle = () => wait(260);
    // add a paragraph after ¶8 and name it
    document.querySelectorAll('[data-id="b4"] .sk-gap')[1].click();
    await wait(30);
    let ed = document.querySelector('[data-id="b4"] textarea.sk-say');
    ok("add: editor opens", !!ed && document.activeElement === ed);
    ed.value = "新增的一段"; ed.dispatchEvent(new Event("input"));
    await settle();
    ed = document.querySelector('[data-id="b4"] textarea.sk-say');
    ok("add: typing survives the server's id", !!ed && ed.value === "新增的一段");
    key(ed, "Enter");
    await settle();
    const added = where("b4").b.paras[1];
    ok("add: saved on the server", added?.say === "新增的一段" && where("b4").b.paras.length === 4);
    // move it down with Alt+↓, then up across the frame edge
    node(added.id).focus();
    key(node(added.id), "ArrowDown", { altKey: true });
    await settle();
    ok("move: Alt+↓", ids("b4") === `p8,p9,${added.id},p10`);
    key(node("p8"), "ArrowUp", { altKey: true });
    await settle();
    ok("move: across frames", ids("b3") === "p5,p6,p7,p8" && ids("b4") === `p9,${added.id},p10`);
    // drag ¶10 to the top of its frame
    const grip = node("p10").querySelector(".sk-grip");
    const g = grip.getBoundingClientRect();
    const first = node("p9").getBoundingClientRect();
    const pe = (type, x, y, target = window) => target.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, button: 0, bubbles: true }));
    pe("pointerdown", g.left + 3, g.top + 3, grip);
    pe("pointermove", g.left + 3, g.top - 20);
    pe("pointermove", first.left + 40, first.top + 4);
    ok("drag: ghost and drop line show", !!document.querySelector(".sk-ghost") && !!document.querySelector(".sk-dropbar"));
    pe("pointerup", first.left + 40, first.top + 4);
    await settle();
    ok("drag: moved", ids("b4") === `p10,p9,${added.id}` && !document.querySelector(".sk-ghost"));
    // remove, undo
    node(added.id).querySelector('[aria-label="刪除"]').click();
    await settle();
    ok("remove", ids("b4") === "p10,p9" && !!document.querySelector(".toast-act"));
    document.querySelector(".toast-act").click();
    await settle();
    ok("undo", ids("b4") === `p10,p9,${added.id}`);
    // edit a title in place
    document.querySelector('[data-id="b4"] .sk-btitle').click();
    await wait(30);
    const te = document.querySelector('[data-id="b4"] textarea.sk-btitle');
    te.value = "外部驗證"; te.dispatchEvent(new Event("input")); key(te, "Enter");
    await settle();
    ok("edit: frame title", where("b4").b.title === "外部驗證");
    // 暫存 repairs what was touched and lists it in the margin
    const before = V.threads.length;
    document.querySelector(".sk-save").click();
    await wait(2600);
    ok("save: repaired, in the margin", !V.dirty && V.threads.length > before && document.querySelectorAll('.sk-thread[data-kind="edit"]').length >= 2);
    // answer by key 1: the next question is there at once, the answer is folded in after
    const q = document.querySelector(".sk-thread.sk-active");
    const qid = q.dataset.thread;
    key(q.querySelector(".sk-answer"), "1");
    await wait(60);
    const nq = document.querySelector(".sk-thread.sk-active");
    ok(`answer: next question at once${!nq ? " (no active card)" : nq.dataset.thread === qid ? " (same card)" : document.activeElement !== nq.querySelector(".sk-answer") ? ` (focus on ${document.activeElement?.className || document.activeElement?.tagName})` : ""}`, !!nq && nq.dataset.thread !== qid && document.activeElement === nq.querySelector(".sk-answer"));
    await wait(2600);
    ok("answer: folded into the paragraph", V.threads.find((t) => t.id === qid).status === "done" && !!document.querySelector(`.sk-points li[data-from="${qid}"]`));
    document.title = `probe ops: ${out.every((x) => x.startsWith("ok")) ? "ok" : "FAILED"} | ${out.join(" | ")}`;
  }
  if (Q.get("at")) { await wait(60); const sc = document.querySelector(".sk-scroll"); const n = document.querySelector(`[data-id="${Q.get("at")}"]`); if (sc && n) sc.scrollTop += n.getBoundingClientRect().top - sc.getBoundingClientRect().top - 12; }
  window.__ready = true;
})();
</script>
</body>
